apiVersion: v1
kind: Service
metadata:
  name: jenkins-webhook
  namespace: jenkins
  labels:
    app.kubernetes.io/name: jenkins
    app.kubernetes.io/instance: jenkins
    app.kubernetes.io/component: jenkins-webhook
    app.kubernetes.io/managed-by: Ansible
spec:
  type: NodePort
  selector:
    app.kubernetes.io/component: jenkins-controller
    app.kubernetes.io/instance: jenkins
  ports:
    - name: http-webhook
      port: 8080
      targetPort: 8080
      nodePort: 32080
      protocol: TCP