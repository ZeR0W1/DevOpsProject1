# Values for the official Jenkins Helm chart. The target lifecycle pins the chart
# in Ansible; the transitional helper uses the same version.

controller:
  # Do not run build executors in the controller. The Kubernetes plugin creates
  # short-lived agent pods for workloads that are migrated to Kubernetes.
  numExecutors: 0
  serviceType: ClusterIP
  javaOpts: "-Xms256m -Xmx512m"
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

  # Plugins in Jenkins/plugins.txt are baked into the matching pinned image.
  # Do not perform plugin downloads during EKS pod startup.
  image:
    registry: docker.io
    repository: zer0w1/devops-project1-jenkins-controller
    tag: 2.528.3-jdk21-plugins-v3
    pullPolicy: Always
  installPlugins: false
  additionalPlugins: []
  overwritePluginsFromImage: false
  initializeOnce: true
  # The chart-created local bootstrap user is the only account by default:
  # self-registration and anonymous read are explicitly disabled. CSRF crumbs
  # remain enabled and bind to the client address.
  securityRealm: |-
    local:
      allowsSignup: false
      enableCaptcha: false
  authorizationStrategy: |-
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  csrf:
    defaultCrumbIssuer:
      proxyCompatability: false
  JCasC:
    defaultConfig: true
    configScripts:
      controller-security: |
        jenkins:
          systemMessage: "Private Jenkins controller managed by Ansible and Helm on the Terraform-owned EKS platform."

# Kubernetes plugin agents are ephemeral. The current Docker-socket inbound
# agent is intentionally not configured here; migrate its build strategy before
# executing the existing image-building pipeline from this controller.
agent:
  enabled: true
  namespace: jenkins
  websocket: true
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

persistence:
  enabled: true
  storageClass: gp2
  accessMode: ReadWriteOnce
  size: 8Gi

# Jenkins remains ClusterIP-only with no public load balancer or Ingress. Use
# in-cluster lifecycle automation and an operator port-forward only when UI access
# is required.
networkPolicy:
  enabled: false

serviceAccount:
  create: true
  automountServiceAccountToken: true

serviceAccountAgent:
  create: true