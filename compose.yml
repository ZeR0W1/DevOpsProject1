services:
    db:
        image: ${POSTGRES_IMAGE}
        networks:
        - app-net
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
            interval: 5s
            timeout: 10s
            retries: 10

    worker:
        image: ${WORKER_IMAGE}
        networks:
        - app-net
        environment:
            DATABASE_URL: postgresql+async://app.secret@:5432/appdb
            DB_HOST: db
            DB_PORT: "5432"
            DB_USER: app
            DB_PASSWORD: secret
            DB_NAME: appdb
            HOST: 0.0.0.0
            PORT: 8000
        depends_on:
                db:
                    condition: service_healthy
networks:
  app-net:
