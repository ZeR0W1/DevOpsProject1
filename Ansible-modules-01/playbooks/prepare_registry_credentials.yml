---
- name: Prepare encrypted Docker Hub credentials for build delivery
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    local_vault_password_file: "{{ playbook_dir }}/../.vault-password"
    local_environment_file: "{{ playbook_dir }}/../vault/local-environment.yml"
    prepare_registry_credentials: false
    registry_delivery_required: false

  tasks:
    - name: Skip registry credential preparation when unnecessary
      ansible.builtin.debug:
        msg: "Stored Docker Hub credentials are not required for this delivery."
      when: not (prepare_registry_credentials | bool)

    - name: Require completed local setup
      ansible.builtin.assert:
        that:
          - local_vault_password_file is file
          - local_environment_file is file
        fail_msg: "Run ../../setup.sh before preparing registry credentials."
      when: prepare_registry_credentials | bool

    - name: Prompt for Docker Hub username
      ansible.builtin.pause:
        prompt: "Docker Hub username or organization owner"
        echo: true
      register: dockerhub_username_prompt
      when: prepare_registry_credentials | bool

    - name: Prompt for Docker Hub access token
      ansible.builtin.pause:
        prompt: "Docker Hub access token"
        echo: false
      register: dockerhub_token_prompt
      no_log: true
      when: prepare_registry_credentials | bool

    - name: Set private Docker Hub inputs
      ansible.builtin.set_fact:
        dockerhub_username: "{{ dockerhub_username_prompt.user_input | lower }}"
        dockerhub_token: "{{ dockerhub_token_prompt.user_input }}"
      no_log: true
      when: prepare_registry_credentials | bool

    - name: Validate Docker Hub inputs
      ansible.builtin.assert:
        that:
          - dockerhub_username | lower is match('^[a-z0-9]+([._-][a-z0-9]+)*$')
          - dockerhub_token | length >= 16
        fail_msg: "Enter a valid Docker Hub owner and access token."
      no_log: true
      when: prepare_registry_credentials | bool

    - name: Verify Docker Hub credentials without exposing them
      ansible.builtin.uri:
        url: >-
          https://auth.docker.io/token?service=registry.docker.io&scope=repository:{{ dockerhub_username | lower }}/devops-project1-frontend:pull,push
        method: GET
        user: "{{ dockerhub_username | lower }}"
        password: "{{ dockerhub_token }}"
        force_basic_auth: true
        status_code: 200
        return_content: false
      no_log: true
      when: prepare_registry_credentials | bool

    - name: Encrypt Docker Hub username
      ansible.builtin.command:
        argv:
          - ansible-vault
          - encrypt_string
          - --vault-password-file
          - "{{ local_vault_password_file }}"
          - --stdin-name
          - dockerhub_username
        stdin: "{{ dockerhub_username | lower }}"
        stdin_add_newline: false
      register: encrypted_dockerhub_username
      changed_when: false
      no_log: true
      when: prepare_registry_credentials | bool

    - name: Encrypt Docker Hub token
      ansible.builtin.command:
        argv:
          - ansible-vault
          - encrypt_string
          - --vault-password-file
          - "{{ local_vault_password_file }}"
          - --stdin-name
          - dockerhub_token
        stdin: "{{ dockerhub_token }}"
        stdin_add_newline: false
      register: encrypted_dockerhub_token
      changed_when: false
      no_log: true
      when: prepare_registry_credentials | bool

    - name: Add or rotate encrypted registry credentials
      ansible.builtin.blockinfile:
        path: "{{ local_environment_file }}"
        mode: "0600"
        marker: "# {mark} ANSIBLE MANAGED REGISTRY CREDENTIALS"
        block: |
          {{ encrypted_dockerhub_username.stdout }}
          {{ encrypted_dockerhub_token.stdout }}
      no_log: true
      when: prepare_registry_credentials | bool

    - name: Report private credential preparation
      ansible.builtin.debug:
        msg: >-
          Docker Hub credentials were verified and added to the ignored mode-0600
          local environment file for BUILD_AND_DEPLOY.
      when: prepare_registry_credentials | bool

    - name: Load registry values for build delivery
      ansible.builtin.include_vars:
        file: "{{ local_environment_file }}"
        name: registry_environment
      no_log: true
      when: registry_delivery_required | bool

    - name: Validate stored registry values for build delivery
      ansible.builtin.assert:
        that:
          - registry_environment.dockerhub_username | default('') | length > 0
          - registry_environment.dockerhub_token | default('') | length >= 16
        fail_msg: "BUILD_AND_DEPLOY requires valid stored Docker Hub credentials."
      no_log: true
      when: registry_delivery_required | bool

    - name: Set the build delivery namespace
      ansible.builtin.set_fact:
        dockerhub_namespace: "{{ registry_environment.dockerhub_username | lower }}"
      no_log: true
      when: registry_delivery_required | bool