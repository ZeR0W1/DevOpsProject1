---
# yamllint disable rule:line-length
- name: Configure the operator-owned Docker Hub credential in private Jenkins
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - ../vars/project.yml

  vars:
    registry_secret_name: jenkins-dockerhub-credential
    jenkins_credential_id: dockerhub-creds
    configure_jenkins_registry_credential: >-
      {{ lookup('ansible.builtin.env', 'CONFIGURE_JENKINS_REGISTRY_CREDENTIAL')
         | default('false', true)
         | bool }}
    jenkins_registry_mutation_confirmation: >-
      {{ lookup('ansible.builtin.env', 'JENKINS_REGISTRY_MUTATION_CONFIRMATION')
         | default('', true) }}

  tasks:
    - name: Report skipped Jenkins registry credential configuration
      ansible.builtin.debug:
        msg: >-
          Jenkins registry credential configuration is disabled; DEPLOY_DEFAULT
          needs no registry credential, while BUILD_AND_DEPLOY requires this stage.
      when: not configure_jenkins_registry_credential

    - name: Configure Jenkins registry credential when explicitly enabled
      when: configure_jenkins_registry_credential
      block:
        - name: Validate Jenkins registry mutation boundary
          ansible.builtin.assert:
            that:
              - jenkins_registry_mutation_confirmation == 'JENKINS_REGISTRY_MUTATION_APPROVED'
              - kubeconfig_file is file
            fail_msg: >-
              Registry configuration requires the exact confirmation and prepared
              target kubeconfig.

        - name: Load encrypted local Docker Hub inputs
          ansible.builtin.include_vars:
            file: "{{ local_environment_file }}"
            name: local_environment
          no_log: true

        - name: Validate private Docker Hub inputs
          ansible.builtin.assert:
            that:
              - local_environment.dockerhub_username | length > 0
              - local_environment.dockerhub_username | lower is match('^[a-z0-9]+([._-][a-z0-9]+)*$')
              - local_environment.dockerhub_token | length >= 16
            fail_msg: Docker Hub username or token is invalid.
          no_log: true

        - name: Create or update the namespace-scoped registry handoff Secret
          kubernetes.core.k8s:
            state: present
            apply: true
            kubeconfig: "{{ kubeconfig_file }}"
            definition:
              apiVersion: v1
              kind: Secret
              metadata:
                name: "{{ registry_secret_name }}"
                namespace: "{{ jenkins_namespace }}"
                labels:
                  app.kubernetes.io/name: jenkins-registry-credential
                  app.kubernetes.io/managed-by: ansible
              type: Opaque
              stringData:
                username: "{{ local_environment.dockerhub_username | lower }}"
                token: "{{ local_environment.dockerhub_token }}"
          no_log: true

        - name: Launch short-lived in-cluster Jenkins credential configurator
          kubernetes.core.k8s:
            state: present
            kubeconfig: "{{ kubeconfig_file }}"
            definition:
              apiVersion: batch/v1
              kind: Job
              metadata:
                generateName: jenkins-registry-configurator-
                namespace: "{{ jenkins_namespace }}"
                labels:
                  app.kubernetes.io/name: jenkins-registry-configurator
                  app.kubernetes.io/managed-by: ansible
              spec:
                activeDeadlineSeconds: 300
                backoffLimit: 2
                ttlSecondsAfterFinished: 300
                template:
                  metadata:
                    labels:
                      app.kubernetes.io/name: jenkins-registry-configurator
                  spec:
                    automountServiceAccountToken: false
                    restartPolicy: Never
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: 65532
                      runAsGroup: 65532
                      fsGroup: 65532
                      seccompProfile:
                        type: RuntimeDefault
                    containers:
                      - name: configurator
                        image: python:3.12.11-alpine3.22@sha256:5e511b0e940def74dd23389510300c76017ca9bbc92484c40cff0951adf32245
                        imagePullPolicy: IfNotPresent
                        env:
                          - {name: JENKINS_URL, value: "{{ jenkins_service_url }}"}
                          - {name: CREDENTIAL_ID, value: "{{ jenkins_credential_id }}"}
                          - name: JENKINS_USER
                            valueFrom:
                              secretKeyRef:
                                name: "{{ jenkins_admin_secret_name }}"
                                key: jenkins-admin-user
                          - name: JENKINS_PASSWORD
                            valueFrom:
                              secretKeyRef:
                                name: "{{ jenkins_admin_secret_name }}"
                                key: jenkins-admin-password
                          - name: REGISTRY_USERNAME
                            valueFrom:
                              secretKeyRef:
                                name: "{{ registry_secret_name }}"
                                key: username
                          - name: REGISTRY_TOKEN
                            valueFrom:
                              secretKeyRef:
                                name: "{{ registry_secret_name }}"
                                key: token
                        command: [python, -c]
                        args:
                          - |
                            import base64, http.cookiejar, json, os, urllib.error, urllib.parse, urllib.request
                            from xml.sax.saxutils import escape

                            root = os.environ["JENKINS_URL"].rstrip("/")
                            credential_id = urllib.parse.quote(os.environ["CREDENTIAL_ID"], safe="")
                            auth = base64.b64encode(
                                f'{os.environ["JENKINS_USER"]}:{os.environ["JENKINS_PASSWORD"]}'.encode()
                            ).decode()
                            opener = urllib.request.build_opener(
                                urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar())
                            )

                            def request(path, method="GET", body=None, headers=None, expected=(200,)):
                                request_headers = {"Authorization": f"Basic {auth}"}
                                request_headers.update(headers or {})
                                req = urllib.request.Request(root + path, data=body, headers=request_headers, method=method)
                                try:
                                    with opener.open(req, timeout=30) as response:
                                        if response.status not in expected:
                                            raise RuntimeError(f"Unexpected Jenkins status {response.status}")
                                        return response.read()
                                except urllib.error.HTTPError as error:
                                    if error.code not in expected:
                                        raise
                                    return error.read()

                            crumb = json.loads(request("/crumbIssuer/api/json"))
                            xml = (
                                "<com.cloudbees.plugins.credentials.impl.UsernamePasswordCredentialsImpl>"
                                "<scope>GLOBAL</scope>"
                                f"<id>{escape(os.environ['CREDENTIAL_ID'])}</id>"
                                "<description>Docker Hub credential managed by guarded Ansible lifecycle</description>"
                                f"<username>{escape(os.environ['REGISTRY_USERNAME'])}</username>"
                                f"<password>{escape(os.environ['REGISTRY_TOKEN'])}</password>"
                                "</com.cloudbees.plugins.credentials.impl.UsernamePasswordCredentialsImpl>"
                            ).encode()
                            headers = {
                                "Content-Type": "application/xml",
                                crumb["crumbRequestField"]: crumb["crumb"],
                            }
                            try:
                                request(f"/credentials/store/system/domain/_/credential/{credential_id}/config.xml")
                                path = f"/credentials/store/system/domain/_/credential/{credential_id}/config.xml"
                                expected = (200,)
                            except urllib.error.HTTPError as error:
                                if error.code != 404:
                                    raise
                                path = "/credentials/store/system/domain/_/createCredentials"
                                expected = (200, 201, 302)
                            request(path, "POST", xml, headers, expected)
                            print("Configured Jenkins Docker Hub credential without exposing its value.")
                        resources:
                          requests: {cpu: 50m, memory: 64Mi}
                          limits: {cpu: 200m, memory: 128Mi}
                        securityContext:
                          allowPrivilegeEscalation: false
                          capabilities: {drop: [ALL]}
                          readOnlyRootFilesystem: true
          register: jenkins_registry_configurator_job
          no_log: true

        - name: Wait for the Jenkins credential configurator to finish
          kubernetes.core.k8s_info:
            api_version: batch/v1
            kind: Job
            name: "{{ jenkins_registry_configurator_job.result.metadata.name }}"
            namespace: "{{ jenkins_namespace }}"
            kubeconfig: "{{ kubeconfig_file }}"
          register: jenkins_registry_configurator_status
          until: >-
            jenkins_registry_configurator_status.resources | length == 1 and
            (jenkins_registry_configurator_status.resources[0].status.conditions | default([]) |
             selectattr('type', 'in', ['Complete', 'Failed']) |
             selectattr('status', 'equalto', 'True') | list | length) > 0
          retries: 30
          delay: 10
          no_log: true

        - name: Require successful Jenkins credential configuration
          ansible.builtin.assert:
            that:
              - (jenkins_registry_configurator_status.resources[0].status.succeeded | default(0) | int) == 1
            fail_msg: Jenkins registry credential configuration failed.
          no_log: true
