---
- name: Prepare the worker database Kubernetes Secret
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    terraform_dir: "{{ playbook_dir }}/../../terraform"
    application_namespace: devops-app
    worker_db_secret_name: worker-db-secret
    sync_application_secret: >-
      {{ lookup('ansible.builtin.env', 'SYNC_APPLICATION_SECRET')
         | default('false', true)
         | bool }}

  tasks:
    - name: Report skipped application-secret preparation
      ansible.builtin.debug:
        msg: >-
          Application-secret preparation is disabled. Set
          SYNC_APPLICATION_SECRET=true only after reviewing the target AWS
          identity, kubeconfig context, namespace, and secret rotation impact.
      when: not sync_application_secret

    - name: Prepare application secret when explicitly enabled
      when: sync_application_secret
      block:
        - name: Verify the application namespace exists
          ansible.builtin.command:
            argv:
              - kubectl
              - get
              - namespace
              - "{{ application_namespace }}"
          changed_when: false

        - name: Read the Terraform-owned database password secret name
          ansible.builtin.command:
            argv:
              - terraform
              - "-chdir={{ terraform_dir }}"
              - output
              - -raw
              - db_password_secret_name
          register: db_password_secret_name
          changed_when: false

        - name: Read the database password from AWS Secrets Manager
          ansible.builtin.command:
            argv:
              - aws
              - secretsmanager
              - get-secret-value
              - --secret-id
              - "{{ db_password_secret_name.stdout }}"
              - --query
              - SecretString
              - --output
              - text
          register: db_password_secret_value
          changed_when: false
          no_log: true

        - name: Create or update the worker database Kubernetes Secret
          ansible.builtin.command:
            argv:
              - kubectl
              - apply
              - -f
              - -
            stdin: |
              apiVersion: v1
              kind: Secret
              metadata:
                name: {{ worker_db_secret_name }}
                namespace: {{ application_namespace }}
                labels:
                  app.kubernetes.io/name: worker
                  app.kubernetes.io/component: database-credentials
                  app.kubernetes.io/managed-by: ansible
              type: Opaque
              stringData:
                password: {{ db_password_secret_value.stdout | to_json }}
          register: worker_db_secret_apply
          changed_when: >-
            'created' in worker_db_secret_apply.stdout or
            'configured' in worker_db_secret_apply.stdout
          no_log: true