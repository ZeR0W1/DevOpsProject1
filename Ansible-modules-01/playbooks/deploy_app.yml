- name: Deploy myapp on relevant EC2 instances
  hosts: backend:worker
  become: true

  vars_files:
    - ../vault/staging.yml

  vars:
    # SSH key path is stored in vault/staging.yml per environment.
    ansible_ssh_private_key_file: "{{ vault_ssh_private_key_path }}"


  roles:
    # Ensures pip availability for role-managed Python dependency installs.
    - role: buluma.python_pip
      vars:
        # Keep disabled: pip self-update under become(root) has previously failed
        # on Amazon Linux due to interpreter/site-package context mismatch
        # (e.g., missing `packaging` in the active pip module context).
        python_pip_update: false
      tags: ["python", "app"]

    # Deploys code, virtualenv, env file, and systemd service units.
    - role: app
      tags: ["app", "deploy"]
      