- name: Deploy myapp on backend EC2 instances
  hosts: backend:worker
  become: true

  vars_files:
    - ../vault/staging.yml

  vars:
    ansible_ssh_private_key_file: "{{ vault_ssh_private_key_path }}"

  roles:
    - role: buluma.python_pip
      tags: ["python", "app"]

    - role: app
      tags: ["app", "deploy"]