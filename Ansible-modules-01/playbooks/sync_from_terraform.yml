---
- name: Sync Ansible inventory and runtime vars from Terraform outputs
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    terraform_dir: "{{ playbook_dir }}/../../terraform"

  tasks:
    - name: Read Terraform outputs as JSON
      ansible.builtin.command:
        cmd: terraform -chdir={{ terraform_dir }} output -json
      register: tf_output
      changed_when: false

    - name: Parse Terraform output JSON
      ansible.builtin.set_fact:
        tf: "{{ tf_output.stdout | from_json }}"

    - name: Update inventory.ini from Terraform outputs
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/../inventory.ini"
        mode: "0644"
        content: |
          [web]
          Front ansible_host={{ tf.frontend_public_ip.value }} ansible_user=ec2-user

          [backend]
          Back ansible_host={{ tf.backend_public_ip.value }} ansible_user=ec2-user

          [worker]
          Worker ansible_host={{ tf.worker_public_ip.value }} ansible_user=ec2-user

    - name: Update backend group vars from Terraform outputs
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/../group_vars/backend.yml"
        mode: "0644"
        content: |
          ---
          # Backend node runtime
          app_service_name: myapp-backend
          app_entrypoint: src/backend/api.py
          app_exec_start: "{{ '{{ app_venv_dir }}' }}/bin/uvicorn api:app --host 0.0.0.0 --port 8000 --app-dir {{ '{{ app_src_dir }}' }}/src/backend"

          # Shared + backend-specific dependencies
          app_requirements_files:
            - "{{ '{{ app_src_dir }}' }}/src/shared/requirements.txt"
            - "{{ '{{ app_src_dir }}' }}/src/backend/requirements.txt"

          # Runtime environment for backend service
          app_environment:
            API_HOST: "0.0.0.0"
            API_PORT: "8000"
            WORKER_HOST: "{{ tf.worker_private_ip.value }}"
            WORKER_PORT: "8000"
      when: not (lookup('ansible.builtin.env', 'SKIP_GROUP_VARS_WRITE') | default('false') | bool)

    - name: Update worker group vars from Terraform outputs
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/../group_vars/worker.yml"
        mode: "0644"
        content: |
          ---
          # Worker node runtime
          app_service_name: myapp-worker
          app_entrypoint: src/worker/api.py
          app_exec_start: "{{ '{{ app_venv_dir }}' }}/bin/uvicorn api:app --host 0.0.0.0 --port 8000 --app-dir {{ '{{ app_src_dir }}' }}/src/worker"

          # Shared + worker-specific dependencies
          app_requirements_files:
            - "{{ '{{ app_src_dir }}' }}/src/shared/requirements.txt"
            - "{{ '{{ app_src_dir }}' }}/src/worker/requirements.txt"

          # Runtime environment for worker service
          app_environment:
            API_PORT: "8000"
            BACKEND_HOST: "{{ tf.backend_private_ip.value }}"
            BACKEND_PORT: "8000"
            POSTGRES_HOST: "{{ tf.rds_endpoint.value.split(':')[0] }}"
            POSTGRES_PORT: "5432"
            POSTGRES_DB: "postgres"
            POSTGRES_USER: "postgres_master"
            AWS_REGION: "{{ tf.aws_region.value }}"
            POSTGRES_PASSWORD_SECRET_NAME: "{{ tf.db_password_secret_name.value }}"
            S3_BUCKET_NAME: "{{ tf.s3_bucket_name.value }}"
            SNS_TOPIC_ARN: "{{ tf.sns_topic_arn.value }}"
      when: not (lookup('ansible.builtin.env', 'SKIP_GROUP_VARS_WRITE') | default('false') | bool)

    - name: Update web group vars for frontend nginx + S3 bootstrap
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/../group_vars/web.yml"
        mode: "0644"
        content: |
          ---
          # keep using a permanent, pre-existing bucket
          # so that frontend content is stable across environment rebuilds.
          frontend_s3_bucket: "quick-demo-058264247987-us-east-1-an"
          frontend_s3_object_key: "index2.html"

          nginx_remove_default_vhost: true
          nginx_vhosts:
            - listen: "80"
              server_name: "_"
              filename: "myapp_frontend.conf"
              root: "/usr/share/nginx/html"
              index: "index.html"
              extra_parameters: |
                location /health {
                    proxy_pass http://{{ tf.backend_private_ip.value }}:8000/health;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }

                location /machines {
                    proxy_pass http://{{ tf.backend_private_ip.value }}:8000/machines;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }

                location / {
                    try_files $uri $uri/ /index.html;
                }
      when: not (lookup('ansible.builtin.env', 'SKIP_GROUP_VARS_WRITE') | default('false') | bool)
