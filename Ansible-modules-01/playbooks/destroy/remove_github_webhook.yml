---
- name: Remove the project GitHub webhook before platform teardown
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - ../../vars/project.yml
    - ../../vars/project.local.yml

  vars:
    destroy_webhook_authorization: ""
    destroy_jenkins_webhook_url: ""

  tasks:
    - name: Validate GitHub webhook removal authorization
      ansible.builtin.assert:
        that:
          - destroy_webhook_authorization == 'DESTROY_WEBHOOK_AUTHORIZED'
          - destroy_jenkins_webhook_url is match('^https://.+/github-webhook/$')
          - local_environment_file is file
          - project_local_vars_file is file
          - project_github_repository is match('^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$')
        fail_msg: The guarded destroy wrapper did not authorize this webhook stage.

    - name: Load encrypted GitHub lifecycle credential
      ansible.builtin.include_vars:
        file: "{{ local_environment_file }}"
      no_log: true

    - name: Read current GitHub repository webhooks
      ansible.builtin.uri:
        url: "https://api.github.com/repos/{{ project_github_repository }}/hooks"
        method: GET
        return_content: true
        status_code: [200, 401, 403, 404]
        headers:
          Accept: application/vnd.github+json
          Authorization: "Bearer {{ github_api_token }}"
          X-GitHub-Api-Version: "2022-11-28"
      register: destroy_github_webhooks
      changed_when: false
      failed_when: false
      no_log: true

    - name: Require GitHub webhook read access
      ansible.builtin.assert:
        that:
          - destroy_github_webhooks.status | default(0) | int == 200
        fail_msg: >-
          GitHub webhook lookup failed (HTTP {{
            destroy_github_webhooks.status | default(0) | int
          }}): {{
            destroy_github_webhooks.status | default(0) | int
            | github_api_diagnostic('read repository webhooks')
          }}. No webhook or cloud resource was changed.

    - name: Select only the Terraform-output project webhook
      ansible.builtin.set_fact:
        destroy_project_github_webhooks: >-
          {{
            destroy_github_webhooks.json
            | selectattr('config.url', 'equalto', destroy_jenkins_webhook_url)
            | list
          }}
      no_log: true

    - name: Delete the project GitHub webhook
      ansible.builtin.uri:
        url: >-
          https://api.github.com/repos/{{ project_github_repository }}/hooks/{{ item.id }}
        method: DELETE
        status_code: [204, 401, 403, 404]
        headers:
          Accept: application/vnd.github+json
          Authorization: "Bearer {{ github_api_token }}"
          X-GitHub-Api-Version: "2022-11-28"
      loop: "{{ destroy_project_github_webhooks }}"
      loop_control:
        label: project-webhook
      register: destroy_github_webhook_deletions
      failed_when: false
      no_log: true

    - name: Select only non-secret GitHub deletion statuses
      ansible.builtin.set_fact:
        destroy_github_webhook_deletion_statuses: >-
          {{
            destroy_github_webhook_deletions.results | default([])
            | map(attribute='status', default=0)
            | map('int')
            | list
          }}
      no_log: true

    - name: Require every selected GitHub webhook deletion
      ansible.builtin.assert:
        that:
          - destroy_github_webhook_deletion_statuses | reject('equalto', 204) | list | length == 0
        fail_msg: >-
          GitHub webhook deletion failed (HTTP {{
            destroy_github_webhook_deletion_statuses | reject('equalto', 204) | first | default(0)
          }}): {{
            destroy_github_webhook_deletion_statuses
            | reject('equalto', 204)
            | first
            | default(0)
            | github_api_diagnostic('delete the selected webhook')
          }}. Teardown stopped before later destructive stages.
