---
- name: Remove the project GitHub webhook before platform teardown
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - ../../vars/project.yml
    - ../../vars/project.local.yml

  vars:
    destroy_webhook_authorization: ""
    destroy_jenkins_webhook_url: ""

  tasks:
    - name: Validate GitHub webhook removal authorization
      ansible.builtin.assert:
        that:
          - destroy_webhook_authorization == 'DESTROY_WEBHOOK_AUTHORIZED'
          - destroy_jenkins_webhook_url is match('^https://.+/github-webhook/$')
          - local_environment_file is file
          - project_local_vars_file is file
          - project_github_repository is match('^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$')
        fail_msg: The guarded destroy wrapper did not authorize this webhook stage.

    - name: Load encrypted GitHub lifecycle credential
      ansible.builtin.include_vars:
        file: "{{ local_environment_file }}"
      no_log: true

    - name: Read current GitHub repository webhooks
      ansible.builtin.uri:
        url: "https://api.github.com/repos/{{ project_github_repository }}/hooks"
        method: GET
        return_content: true
        status_code: 200
        headers:
          Accept: application/vnd.github+json
          Authorization: "Bearer {{ github_api_token }}"
          X-GitHub-Api-Version: "2022-11-28"
      register: destroy_github_webhooks
      changed_when: false
      no_log: true

    - name: Select only the Terraform-output project webhook
      ansible.builtin.set_fact:
        destroy_project_github_webhooks: >-
          {{
            destroy_github_webhooks.json
            | selectattr('config.url', 'equalto', destroy_jenkins_webhook_url)
            | list
          }}
      no_log: true

    - name: Delete the project GitHub webhook
      ansible.builtin.uri:
        url: >-
          https://api.github.com/repos/{{ project_github_repository }}/hooks/{{ item.id }}
        method: DELETE
        status_code: 204
        headers:
          Accept: application/vnd.github+json
          Authorization: "Bearer {{ github_api_token }}"
          X-GitHub-Api-Version: "2022-11-28"
      loop: "{{ destroy_project_github_webhooks }}"
      loop_control:
        label: project-webhook
      no_log: true
