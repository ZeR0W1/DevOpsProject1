---
- name: Deploy application charts to Kubernetes with Helm
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    project_root: "{{ playbook_dir }}/../.."
    terraform_dir: "{{ project_root }}/terraform"
    frontend_chart_dir: "{{ project_root }}/helm/frontend"
    backend_chart_dir: "{{ project_root }}/helm/backend"
    worker_chart_dir: "{{ project_root }}/helm/worker"
    frontend_source_html: "{{ project_root }}/Ansible-modules-01/roles/app/files/app/src/frontend/index2.html"
    frontend_chart_html: "{{ frontend_chart_dir }}/files/index.html"

  tasks:
    - name: Read Terraform outputs as JSON
      ansible.builtin.command:
        cmd: terraform -chdir={{ terraform_dir }} output -json
      register: tf_output
      changed_when: false

    - name: Parse Terraform output JSON
      ansible.builtin.set_fact:
        tf: "{{ tf_output.stdout | from_json }}"

    - name: Sync frontend HTML into chart files directory
      ansible.builtin.copy:
        src: "{{ frontend_source_html }}"
        dest: "{{ frontend_chart_html }}"
        mode: "0644"

    - name: Create or update worker DB Kubernetes Secret
      ansible.builtin.command:
        cmd: >-
          kubectl create secret generic worker-db-secret
          --namespace devops-app
          --from-literal=password=$(terraform -chdir={{ terraform_dir }} output -raw db_password_secret_name)
          --dry-run=client -o yaml | kubectl apply -f -

    - name: Deploy frontend chart
      ansible.builtin.command:
        cmd: >-
          helm upgrade --install frontend {{ frontend_chart_dir }} -f {{ frontend_chart_dir }}/values.yaml

    - name: Deploy backend chart
      ansible.builtin.command:
        cmd: >-
          helm upgrade --install backend {{ backend_chart_dir }} -f {{ backend_chart_dir }}/values.yaml

    - name: Deploy worker chart
      ansible.builtin.command:
        cmd: >-
          helm upgrade --install worker {{ worker_chart_dir }} -f {{ worker_chart_dir }}/values.yaml
          --set database.host={{ tf.rds_hostname.value }}
          --set database.port={{ tf.db_port.value }}
          --set database.name={{ tf.db_name.value }}
          --set database.user={{ tf.db_username.value }}