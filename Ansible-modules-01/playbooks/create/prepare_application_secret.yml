---
- name: Prepare the worker database Kubernetes Secret
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - ../../vars/project.yml

  vars:
    sync_application_secret: >-
      {{ lookup('ansible.builtin.env', 'SYNC_APPLICATION_SECRET')
         | default('false', true)
         | bool }}
    application_secret_mutation_confirmation: >-
      {{ lookup('ansible.builtin.env', 'APPLICATION_SECRET_MUTATION_CONFIRMATION')
         | default('', true) }}

  tasks:
    - name: Report skipped application-secret synchronization
      ansible.builtin.debug:
        msg: >-
          Kubernetes database Secret synchronization is disabled. Set
          SYNC_APPLICATION_SECRET=true only after preparing the runtime handoff
          and reviewing the AWS identity, kubeconfig context, namespace, and
          secret rotation impact.
      when: not sync_application_secret

    - name: Synchronize application secret when explicitly enabled
      when: sync_application_secret
      block:
        - name: Require prepared application runtime handoff before secret synchronization
          ansible.builtin.assert:
            that:
              - application_secret_mutation_confirmation == 'APPLICATION_SECRET_MUTATION_APPROVED'
              - runtime_values_file is file
              - kubeconfig_file is file
            fail_msg: >-
              Secret synchronization requires the exact confirmation, prepared
              runtime handoff, and target kubeconfig.

        - name: Load prepared non-secret application runtime values
          ansible.builtin.include_vars:
            file: "{{ runtime_values_file }}"
            name: application_runtime
          no_log: true

        - name: Validate runtime values required for secret synchronization
          ansible.builtin.assert:
            that:
              - application_runtime.aws_region | length > 0
              - application_runtime.db_password_secret_name | length > 0
              - application_runtime.worker_db_secret_name == worker_db_secret_name
            fail_msg: Prepared application runtime handoff is incomplete or invalid.
          no_log: true

        - name: Verify the application namespace exists
          ansible.builtin.command:
            argv:
              - kubectl
              - --kubeconfig
              - "{{ kubeconfig_file }}"
              - get
              - namespace
              - "{{ application_namespace }}"
          changed_when: false

        - name: Read the database password from AWS Secrets Manager
          ansible.builtin.command:
            argv:
              - aws
              - secretsmanager
              - get-secret-value
              - --secret-id
              - "{{ application_runtime.db_password_secret_name }}"
              - --region
              - "{{ application_runtime.aws_region }}"
              - --query
              - SecretString
              - --output
              - text
          register: db_password_secret_value
          changed_when: false
          no_log: true

        - name: Create or update the worker database Kubernetes Secret
          kubernetes.core.k8s:
            state: present
            kubeconfig: "{{ kubeconfig_file }}"
            definition:
              apiVersion: v1
              kind: Secret
              metadata:
                name: "{{ worker_db_secret_name }}"
                namespace: "{{ application_namespace }}"
                labels:
                  app.kubernetes.io/name: worker
                  app.kubernetes.io/component: database-credentials
                  app.kubernetes.io/managed-by: ansible
              type: Opaque
              stringData:
                password: "{{ db_password_secret_value.stdout }}"
          no_log: true
