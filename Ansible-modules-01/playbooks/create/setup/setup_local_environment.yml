---
- name: Create encrypted local environment inputs
  hosts: localhost
  connection: local
  gather_facts: false

  vars_prompt:
    - name: admin_email
      prompt: "Administrator email for SNS notifications"
      private: false

    - name: github_api_token
      prompt: >-
        Fine-grained GitHub token with repository webhook read/write permission
      private: true

  vars_files:
    - ../../../vars/project.yml

  vars:
    terraform_example: "{{ project_root }}/terraform/terraform.tfvars.example"
    local_vault_file: "{{ local_environment_file }}"

  tasks:
    - name: Normalize the hidden GitHub token input
      ansible.builtin.set_fact:
        normalized_github_api_token: "{{ github_api_token | trim }}"
      no_log: true

    - name: Read the controller clone GitHub origin
      ansible.builtin.command:
        argv: [git, -C, "{{ project_root }}", remote, get-url, origin]
      register: setup_git_origin
      changed_when: false

    - name: Read the controller clone current branch
      ansible.builtin.command:
        argv: [git, -C, "{{ project_root }}", branch, --show-current]
      register: setup_git_branch
      changed_when: false

    - name: Confirm detected SCM context or enter another repository
      ansible.builtin.pause:
        prompt: >-
          Detected repository {{ setup_git_origin.stdout | trim }} and branch
          {{ setup_git_branch.stdout | trim | default('(detached HEAD)', true) }}.
          Enter yes to use both, or enter another GitHub HTTPS repository URL
      register: setup_scm_confirmation

    - name: Prompt for the branch of an alternate repository
      ansible.builtin.pause:
        prompt: "Branch Jenkins should watch in the alternate repository"
      register: setup_alternate_branch
      when: setup_scm_confirmation.user_input | trim | lower not in ['y', 'yes']

    - name: Select canonical local SCM inputs
      ansible.builtin.set_fact:
        selected_project_scm_url: >-
          {{
            (
              setup_git_origin.stdout | trim
              if setup_scm_confirmation.user_input | trim | lower in ['y', 'yes']
              else setup_scm_confirmation.user_input | trim
            ) | regex_replace('\.git$', '')
          }}.git
        selected_project_scm_branch: >-
          {{
            setup_git_branch.stdout | trim
            if setup_scm_confirmation.user_input | trim | lower in ['y', 'yes']
            else setup_alternate_branch.user_input | trim
          }}

    - name: Validate selected local SCM inputs
      ansible.builtin.assert:
        that:
          - >-
            selected_project_scm_url
            is match('^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+\.git$')
          - selected_project_scm_branch | length > 0
          - selected_project_scm_branch is match('^[A-Za-z0-9][A-Za-z0-9._/-]*$')
          - "'..' not in selected_project_scm_branch"
          - "'@{' not in selected_project_scm_branch"
          - "'//' not in selected_project_scm_branch"
          - not selected_project_scm_branch.endswith('/')
          - not selected_project_scm_branch.endswith('.lock')
        fail_msg: >-
          Select a GitHub HTTPS repository without embedded credentials and a
          safely named, non-empty branch. Detached HEAD cannot be accepted.

    - name: Derive selected GitHub repository slug
      ansible.builtin.set_fact:
        selected_github_repository: >-
          {{
            selected_project_scm_url
            | regex_replace('^https://github\.com/', '')
            | regex_replace('\.git$', '')
          }}

    - name: Verify the GitHub token is valid
      ansible.builtin.uri:
        url: https://api.github.com/user
        method: GET
        return_content: false
        status_code: 200
        headers:
          Accept: application/vnd.github+json
          Authorization: "Bearer {{ normalized_github_api_token }}"
          X-GitHub-Api-Version: "2022-11-28"
      changed_when: false
      no_log: true

    - name: Verify token access to the selected repository
      ansible.builtin.uri:
        url: "https://api.github.com/repos/{{ selected_github_repository }}"
        method: GET
        return_content: false
        status_code: 200
        headers:
          Accept: application/vnd.github+json
          Authorization: "Bearer {{ normalized_github_api_token }}"
          X-GitHub-Api-Version: "2022-11-28"
      changed_when: false
      no_log: true

    - name: Verify token access to the selected repository webhooks
      ansible.builtin.uri:
        url: "https://api.github.com/repos/{{ selected_github_repository }}/hooks"
        method: GET
        return_content: false
        status_code: 200
        headers:
          Accept: application/vnd.github+json
          Authorization: "Bearer {{ normalized_github_api_token }}"
          X-GitHub-Api-Version: "2022-11-28"
      changed_when: false
      no_log: true

    - name: Write non-secret controller-local SCM variables
      ansible.builtin.copy:
        dest: "{{ project_local_vars_file }}"
        mode: "0600"
        content: |
          ---
          # Generated by setup; may be edited before rerunning the guarded lifecycle.
          project_scm_url: {{ selected_project_scm_url | to_json }}
          project_scm_branch: {{ selected_project_scm_branch | to_json }}

    - name: Read authoritative Terraform input example
      ansible.builtin.set_fact:
        terraform_example_content: "{{ lookup('ansible.builtin.file', terraform_example) }}"

    - name: Derive project and environment identifiers from the example
      ansible.builtin.set_fact:
        terraform_name_prefix: >-
          {{ (terraform_example_content
              | regex_search('(?m)^name_prefix\s*=\s*"([a-z0-9-]+)"', '\1')
              | first) }}
        terraform_environment: >-
          {{ (terraform_example_content
              | regex_search('(?m)^environment\s*=\s*"([a-z0-9-]+)"', '\1')
              | first) }}

    - name: Validate administrator email and derived identifiers
      ansible.builtin.assert:
        that:
          - admin_email is match('^[^@\s]+@[^@\s]+\.[^@\s]+$')
          - terraform_name_prefix is match('^[a-z][a-z0-9-]{1,15}$')
          - terraform_environment is match('^[a-z][a-z0-9-]{1,15}$')
          - normalized_github_api_token | length >= 20
        fail_msg: >-
          Enter a valid email and ensure name_prefix/environment in
          terraform.tfvars.example are lowercase.

    - name: Detect the control node public IPv4 address
      ansible.builtin.uri:
        url: https://checkip.amazonaws.com
        return_content: true
        timeout: 10
      register: detected_public_ip
      changed_when: false
      when: admin_cidr is not defined

    - name: Confirm detected CIDR or enter an IPv4 slash-32 override
      ansible.builtin.pause:
        prompt: >-
          Detected {{ detected_public_ip.content | trim }}/32. Enter yes to use it,
          or enter the required administrator IPv4 CIDR ending in /32
      register: admin_cidr_confirmation
      when: admin_cidr is not defined

    - name: Select administrator CIDR and deterministic database username
      ansible.builtin.set_fact:
        selected_admin_cidr: >-
          {{ admin_cidr if admin_cidr is defined else
             ((detected_public_ip.content | trim) ~ '/32'
              if (admin_cidr_confirmation.user_input | lower) in ['y', 'yes']
              else (admin_cidr_confirmation.user_input | trim)) }}
        derived_db_username: >-
          {{ (terraform_name_prefix ~ '_' ~ terraform_environment ~ '_admin')
             | regex_replace('[^a-z0-9_]', '_') }}

    - name: Validate selected private environment inputs
      ansible.builtin.assert:
        that:
          - selected_admin_cidr is match('^(25[0-5]|2[0-4][0-9]|1?[0-9]{1,2})(\.(25[0-5]|2[0-4][0-9]|1?[0-9]{1,2})){3}/32$')
          - derived_db_username is match('^[a-z][a-z0-9_]{0,62}$')
        fail_msg: "The administrator CIDR must be a valid IPv4 /32."

    - name: Verify the setup entry point created the local vault password securely
      ansible.builtin.stat:
        path: "{{ local_vault_password_file }}"
      register: local_vault_password

    - name: Require a private local vault password file
      ansible.builtin.assert:
        that:
          - local_vault_password.stat.isreg | default(false)
          - local_vault_password.stat.mode == '0600'
        fail_msg: >-
          Run setup.sh so it can create the local vault password with mode 0600
          before this playbook encrypts local environment values.

    - name: Encrypt administrator email as a named variable
      ansible.builtin.command:
        argv:
          - ansible-vault
          - encrypt_string
          - --vault-password-file
          - "{{ local_vault_password_file }}"
          - --encrypt-vault-id
          - default
          - --stdin-name
          - admin_email
        stdin: "{{ admin_email }}"
        stdin_add_newline: false
      register: encrypted_admin_email
      changed_when: false
      no_log: true

    - name: Encrypt administrator CIDR as a named variable
      ansible.builtin.command:
        argv:
          - ansible-vault
          - encrypt_string
          - --vault-password-file
          - "{{ local_vault_password_file }}"
          - --encrypt-vault-id
          - default
          - --stdin-name
          - admin_cidr
        stdin: "{{ selected_admin_cidr }}"
        stdin_add_newline: false
      register: encrypted_admin_cidr
      changed_when: false
      no_log: true

    - name: Encrypt database username as a named variable
      ansible.builtin.command:
        argv:
          - ansible-vault
          - encrypt_string
          - --vault-password-file
          - "{{ local_vault_password_file }}"
          - --encrypt-vault-id
          - default
          - --stdin-name
          - db_username
        stdin: "{{ derived_db_username }}"
        stdin_add_newline: false
      register: encrypted_db_username
      changed_when: false
      no_log: true

    - name: Encrypt GitHub API token as a named variable
      ansible.builtin.command:
        argv:
          - ansible-vault
          - encrypt_string
          - --vault-password-file
          - "{{ local_vault_password_file }}"
          - --encrypt-vault-id
          - default
          - --stdin-name
          - github_api_token
        stdin: "{{ normalized_github_api_token }}"
        stdin_add_newline: false
      register: encrypted_github_api_token
      changed_when: false
      no_log: true

    - name: Write encrypted local environment variables
      ansible.builtin.copy:
        dest: "{{ local_vault_file }}"
        mode: "0600"
        content: |
          ---
          {{ encrypted_admin_email.stdout }}
          {{ encrypted_admin_cidr.stdout }}
          {{ encrypted_db_username.stdout }}
          {{ encrypted_github_api_token.stdout }}
      no_log: true

    - name: Report setup completion without private values
      ansible.builtin.debug:
        msg:
          - >-
            Encrypted local environment inputs, controller-local SCM variables,
            and the local vault password were created with mode 0600. None is
            tracked by Git.
          - "Selected repository: {{ selected_github_repository }}"
          - "Selected Jenkins branch: {{ selected_project_scm_branch }}"
