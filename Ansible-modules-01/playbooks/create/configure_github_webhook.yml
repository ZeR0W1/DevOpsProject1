---
- name: Configure Jenkins HMAC validation and the GitHub repository webhook
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - ../../vars/project.yml
    - ../../vars/project.local.yml

  vars:
    configure_github_webhook: >-
      {{ lookup('ansible.builtin.env', 'CONFIGURE_GITHUB_WEBHOOK')
         | default('false', true)
         | bool }}
    github_webhook_mutation_confirmation: >-
      {{ lookup('ansible.builtin.env', 'GITHUB_WEBHOOK_MUTATION_CONFIRMATION')
         | default('', true) }}
    jenkins_webhook_secret_name: jenkins-github-webhook
    jenkins_webhook_credentials_id: github-webhook-hmac

  tasks:
    - name: Report skipped GitHub webhook lifecycle
      ansible.builtin.debug:
        msg: GitHub webhook and Jenkins HMAC configuration is disabled.
      when: not configure_github_webhook

    - name: Configure GitHub webhook lifecycle when explicitly enabled
      when: configure_github_webhook
      block:
        - name: Validate GitHub webhook mutation boundary
          ansible.builtin.assert:
            that:
              - >-
                github_webhook_mutation_confirmation ==
                'GITHUB_WEBHOOK_MUTATION_APPROVED'
              - local_environment_file is file
              - project_local_vars_file is file
              - kubeconfig_file is file
              - project_github_repository is match('^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$')
            fail_msg: >-
              Webhook configuration requires exact approval plus the encrypted
              local environment and target kubeconfig.

        - name: Load encrypted GitHub API token
          ansible.builtin.include_vars:
            file: "{{ local_environment_file }}"
          no_log: true

        - name: Validate encrypted GitHub API token
          ansible.builtin.assert:
            that:
              - github_api_token | default('') | length >= 20
            fail_msg: Rerun setup_local_environment.yml with a GitHub webhook token.
          no_log: true

        - name: Read public webhook lifecycle outputs
          ansible.builtin.command:
            argv:
              - terraform
              - "-chdir={{ terraform_dir }}"
              - output
              - -json
          register: github_webhook_terraform_outputs_command
          changed_when: false
          no_log: true

        - name: Parse public webhook lifecycle outputs
          ansible.builtin.set_fact:
            github_webhook_terraform_outputs: >-
              {{ github_webhook_terraform_outputs_command.stdout | from_json }}
          no_log: true

        - name: Validate public webhook lifecycle outputs
          ansible.builtin.assert:
            that:
              - >-
                github_webhook_terraform_outputs.jenkins_webhook_url.value
                is match('^https://.+/github-webhook/$')
              - >-
                github_webhook_terraform_outputs.public_tls_mode.value
                in ['route53', 'self_signed']
            fail_msg: Terraform public webhook outputs are missing or invalid.
          no_log: true

        - name: Read existing Jenkins webhook HMAC Secret
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Secret
            name: "{{ jenkins_webhook_secret_name }}"
            namespace: "{{ jenkins_namespace }}"
            kubeconfig: "{{ kubeconfig_file }}"
          register: existing_jenkins_webhook_secret
          no_log: true

        - name: Generate a new webhook HMAC secret only when absent
          ansible.builtin.command:
            argv: [openssl, rand, -hex, "32"]
          register: generated_jenkins_webhook_secret
          changed_when: true
          no_log: true
          when: existing_jenkins_webhook_secret.resources | length == 0

        - name: Select effective webhook HMAC secret
          ansible.builtin.set_fact:
            github_webhook_hmac_secret: >-
              {{
                generated_jenkins_webhook_secret.stdout | trim
                if existing_jenkins_webhook_secret.resources | length == 0
                else existing_jenkins_webhook_secret.resources[0].data.secret | b64decode
              }}
          no_log: true

        - name: Synchronize the Jenkins webhook HMAC Secret
          kubernetes.core.k8s:
            state: present
            kubeconfig: "{{ kubeconfig_file }}"
            definition:
              apiVersion: v1
              kind: Secret
              metadata:
                name: "{{ jenkins_webhook_secret_name }}"
                namespace: "{{ jenkins_namespace }}"
                labels:
                  app.kubernetes.io/name: jenkins-github-webhook
                  app.kubernetes.io/managed-by: ansible
              type: Opaque
              stringData:
                secret: "{{ github_webhook_hmac_secret }}"
          no_log: true

        - name: Launch short-lived Jenkins HMAC configuration job
          kubernetes.core.k8s:
            state: present
            kubeconfig: "{{ kubeconfig_file }}"
            definition:
              apiVersion: batch/v1
              kind: Job
              metadata:
                generateName: jenkins-webhook-config-
                namespace: "{{ jenkins_namespace }}"
                labels:
                  app.kubernetes.io/name: jenkins-webhook-config
                  app.kubernetes.io/managed-by: ansible
              spec:
                activeDeadlineSeconds: 300
                backoffLimit: 2
                ttlSecondsAfterFinished: 300
                template:
                  metadata:
                    labels:
                      app.kubernetes.io/name: jenkins-webhook-config
                  spec:
                    automountServiceAccountToken: false
                    restartPolicy: Never
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: 1000
                      runAsGroup: 1000
                      seccompProfile:
                        type: RuntimeDefault
                    containers:
                      - name: configurer
                        image: >-
                          docker.io/zer0w1/devops-project1-jenkins-controller:2.528.3-jdk21-plugins-v3
                        imagePullPolicy: Always
                        env:
                          - name: JENKINS_URL
                            value: "{{ jenkins_service_url }}"
                          - name: JENKINS_USER
                            valueFrom:
                              secretKeyRef:
                                name: "{{ jenkins_admin_secret_name }}"
                                key: jenkins-admin-user
                          - name: JENKINS_PASSWORD
                            valueFrom:
                              secretKeyRef:
                                name: "{{ jenkins_admin_secret_name }}"
                                key: jenkins-admin-password
                          - name: WEBHOOK_SECRET
                            valueFrom:
                              secretKeyRef:
                                name: "{{ jenkins_webhook_secret_name }}"
                                key: secret
                          - name: WEBHOOK_URL
                            value: >-
                              {{ github_webhook_terraform_outputs.jenkins_webhook_url.value }}
                          - name: WEBHOOK_CREDENTIALS_ID
                            value: "{{ jenkins_webhook_credentials_id }}"
                        command: [bash, -ceu]
                        args:
                          - |
                            cat > /tmp/configure-webhook.groovy <<'GROOVY'
                            import com.cloudbees.plugins.credentials.CredentialsScope
                            import com.cloudbees.plugins.credentials.SystemCredentialsProvider
                            import com.cloudbees.plugins.credentials.domains.Domain
                            import org.jenkinsci.plugins.github.config.GitHubPluginConfig
                            import org.jenkinsci.plugins.github.config.HookSecretConfig
                            import org.jenkinsci.plugins.plaincredentials.impl.StringCredentialsImpl
                            import hudson.util.Secret
                            import jenkins.model.Jenkins

                            def id = System.getenv('WEBHOOK_CREDENTIALS_ID')
                            def value = System.getenv('WEBHOOK_SECRET')
                            def store = SystemCredentialsProvider.getInstance().getStore()
                            def existing = SystemCredentialsProvider.getInstance().getCredentials().find { it.id == id }
                            def desired = new StringCredentialsImpl(
                              CredentialsScope.GLOBAL, id, 'GitHub webhook HMAC secret', Secret.fromString(value)
                            )
                            def domain = Domain.global()
                            existing ? store.updateCredentials(domain, existing, desired) : store.addCredentials(domain, desired)

                            def config = Jenkins.get().getDescriptorByType(GitHubPluginConfig.class)
                            config.setHookUrl(System.getenv('WEBHOOK_URL'))
                            config.setHookSecretConfigs([new HookSecretConfig(id, 'SHA256')])
                            config.save()
                            GROOVY
                            curl -fsSL "$JENKINS_URL/jnlpJars/jenkins-cli.jar" \
                              -o /tmp/jenkins-cli.jar
                            java -jar /tmp/jenkins-cli.jar \
                              -s "$JENKINS_URL" \
                              -auth "$JENKINS_USER:$JENKINS_PASSWORD" \
                              groovy = < /tmp/configure-webhook.groovy
                        resources:
                          requests: {cpu: 50m, memory: 128Mi}
                          limits: {cpu: 250m, memory: 256Mi}
                        securityContext:
                          allowPrivilegeEscalation: false
                          capabilities:
                            drop: [ALL]
                          readOnlyRootFilesystem: false
          register: jenkins_webhook_config_job
          no_log: true

        - name: Wait for Jenkins HMAC configuration job
          kubernetes.core.k8s_info:
            api_version: batch/v1
            kind: Job
            name: "{{ jenkins_webhook_config_job.result.metadata.name }}"
            namespace: "{{ jenkins_namespace }}"
            kubeconfig: "{{ kubeconfig_file }}"
          register: jenkins_webhook_config_status
          until: >-
            jenkins_webhook_config_status.resources | length == 1 and
            (jenkins_webhook_config_status.resources[0].status.conditions | default([]) |
             selectattr('type', 'in', ['Complete', 'Failed']) |
             selectattr('status', 'equalto', 'True') | list | length) > 0
          retries: 30
          delay: 10
          no_log: true

        - name: Require successful Jenkins HMAC configuration
          ansible.builtin.assert:
            that:
              - >-
                jenkins_webhook_config_status.resources[0].status.succeeded
                | default(0) | int == 1
            fail_msg: Jenkins webhook HMAC configuration failed.
          no_log: true

        - name: Read existing GitHub repository webhooks
          ansible.builtin.uri:
            url: "https://api.github.com/repos/{{ project_github_repository }}/hooks"
            method: GET
            return_content: true
            status_code: 200
            headers:
              Accept: application/vnd.github+json
              Authorization: "Bearer {{ github_api_token }}"
              X-GitHub-Api-Version: "2022-11-28"
          register: existing_github_webhooks
          changed_when: false
          no_log: true

        - name: Select existing project webhook
          ansible.builtin.set_fact:
            existing_github_webhook: >-
              {{
                existing_github_webhooks.json
                | selectattr('config.url', 'equalto', github_webhook_terraform_outputs.jenkins_webhook_url.value)
                | list
                | first
                | default({})
              }}
          no_log: true

        - name: Create or update the GitHub repository webhook
          ansible.builtin.uri:
            url: >-
              https://api.github.com/repos/{{ project_github_repository }}/hooks{{
                '/' ~ existing_github_webhook.id
                if existing_github_webhook.id is defined
                else ''
              }}
            method: "{{ 'PATCH' if existing_github_webhook.id is defined else 'POST' }}"
            body_format: json
            body:
              name: web
              active: true
              events: [push]
              config:
                url: "{{ github_webhook_terraform_outputs.jenkins_webhook_url.value }}"
                content_type: json
                insecure_ssl: >-
                  {{
                    '0'
                    if github_webhook_terraform_outputs.public_tls_mode.value == 'route53'
                    else '1'
                  }}
                secret: "{{ github_webhook_hmac_secret }}"
            status_code: "{{ [200] if existing_github_webhook.id is defined else [201] }}"
            headers:
              Accept: application/vnd.github+json
              Authorization: "Bearer {{ github_api_token }}"
              X-GitHub-Api-Version: "2022-11-28"
          no_log: true

        - name: Report configured webhook without secrets
          ansible.builtin.debug:
            msg: >-
              Configured the repository push webhook and Jenkins SHA-256 HMAC
              validation. GitHub SSL verification is {{
                'enabled' if github_webhook_terraform_outputs.public_tls_mode.value == 'route53'
                else 'disabled for the documented self-signed lab fallback'
              }}.
