---
# yamllint disable rule:line-length
- name: Seed separate Jenkins CI and CD jobs
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - ../../vars/project.yml
    - ../../vars/project.local.yml

  vars:
    seed_jenkins_jobs: >-
      {{ lookup('ansible.builtin.env', 'SEED_JENKINS_JOBS')
         | default('false', true)
         | bool }}
    jenkins_job_mutation_confirmation: >-
      {{ lookup('ansible.builtin.env', 'JENKINS_JOB_MUTATION_CONFIRMATION')
         | default('', true) }}
    application_runtime:
      aws_region: us-east-1
      eks_cluster_name: validation-cluster
      rds_hostname: validation-db.internal
      db_port: "5432"
      db_name: validation_db
      db_username: validation_user
      worker_db_secret_name: "{{ worker_db_secret_name }}"
      application_s3_bucket: validation-runtime-bucket
      sns_topic_arn: arn:aws:sns:us-east-1:123456789012:validation-topic
    selected_image_namespace: >-
      {{ effective_dockerhub_namespace
         if delivery_mode | default('DEPLOY_DEFAULT') == 'BUILD_AND_DEPLOY'
         else 'zer0w1' }}
    common_runtime_parameters:
      - {type: string, name: AWS_REGION, default: "{{ application_runtime.aws_region }}", description: AWS region containing the Terraform-owned EKS cluster.}
      - {type: string, name: EKS_CLUSTER_NAME, default: "{{ application_runtime.eks_cluster_name }}", description: Terraform-owned EKS cluster name.}
      - {type: string, name: DEPLOY_NAMESPACE, default: "{{ application_namespace }}", description: Application namespace.}
      - {type: string, name: FRONTEND_CONTENT_BUCKET, default: "{{ application_runtime.application_s3_bucket }}", description: Terraform-owned application content bucket.}
      - {type: string, name: FRONTEND_CONTENT_KEY, default: index.html, description: Fixed runtime frontend content object.}
      - {type: string, name: WORKER_DB_HOST, default: "{{ application_runtime.rds_hostname }}", description: Terraform-owned RDS hostname.}
      - {type: string, name: WORKER_DB_PORT, default: "{{ application_runtime.db_port }}", description: Terraform-owned RDS PostgreSQL port.}
      - {type: string, name: WORKER_DB_NAME, default: "{{ application_runtime.db_name }}", description: Terraform PostgreSQL database name.}
      - {type: string, name: WORKER_DB_USER, default: "{{ application_runtime.db_username }}", description: Terraform PostgreSQL username.}
      - {type: string, name: WORKER_DB_SECRET_NAME, default: "{{ application_runtime.worker_db_secret_name }}", description: Ansible-managed Kubernetes database Secret name.}
      - {type: string, name: WORKER_S3_BUCKET, default: "{{ application_runtime.application_s3_bucket }}", description: Terraform-owned worker catalog bucket.}
      - {type: string, name: WORKER_SNS_TOPIC_ARN, default: "{{ application_runtime.sns_topic_arn }}", description: Terraform-owned worker SNS topic ARN.}
    jenkins_jobs:
      - name: devops-project1-eks-deploy
        description: Standalone EKS Helm CD pipeline for frontend, backend, and worker.
        scm_url: "{{ project_scm_url }}"
        scm_ref: "*/{{ project_scm_branch }}"
        scm_credentials_id: ""
        script_path: Jenkins/Jenkinsfile-deploy
        github_trigger: false
        parameters: >-
          {{ [
            {'type': 'string', 'name': 'REPO_URL', 'default': project_scm_url, 'description': 'Repository containing all three application Helm charts.'},
            {'type': 'string', 'name': 'REPO_REF', 'default': project_scm_branch, 'description': 'Branch, tag, or commit containing the charts.'},
            {'type': 'string', 'name': 'GIT_CREDENTIALS_ID', 'default': '', 'description': 'Optional Jenkins Git credential ID.'},
            {'type': 'string', 'name': 'FRONTEND_IMAGE_REPOSITORY', 'default': selected_image_namespace ~ '/devops-project1-frontend', 'description': 'Frontend image repository produced by CI.'},
            {'type': 'string', 'name': 'BACKEND_IMAGE_REPOSITORY', 'default': selected_image_namespace ~ '/devops-project1-backend', 'description': 'Backend image repository produced by CI.'},
            {'type': 'string', 'name': 'WORKER_IMAGE_REPOSITORY', 'default': selected_image_namespace ~ '/devops-project1-worker', 'description': 'Worker image repository produced by CI.'},
            {'type': 'string', 'name': 'IMAGE_TAG', 'default': '', 'description': 'Required immutable image tag for FULL mode.'},
            {'type': 'choice', 'name': 'DEPLOY_MODE', 'choices': ['FULL', 'CONTENT_ONLY'], 'description': 'FULL deploys workloads; CONTENT_ONLY updates frontend content only.'},
            {'type': 'string', 'name': 'CI_JOB_NAME', 'default': '', 'description': 'Optional upstream CI job name for traceability.'},
            {'type': 'string', 'name': 'CI_BUILD_NUMBER', 'default': '', 'description': 'Optional upstream CI build number for traceability.'},
            {'type': 'string', 'name': 'CI_BUILD_URL', 'default': '', 'description': 'Optional upstream CI build URL for traceability.'},
            {'type': 'string', 'name': 'CI_TRIGGER_CAUSE', 'default': '', 'description': 'Optional upstream Jenkins trigger cause for traceability.'},
            {'type': 'string', 'name': 'GIT_AUTHOR_NAME', 'default': '', 'description': 'Optional resolved commit author name from CI.'},
            {'type': 'string', 'name': 'GIT_AUTHOR_EMAIL', 'default': '', 'description': 'Optional resolved commit author email from CI.'},
            {'type': 'string', 'name': 'FRONTEND_IMAGE_DIGEST', 'default': '', 'description': 'Optional immutable frontend digest produced by CI.'},
            {'type': 'string', 'name': 'BACKEND_IMAGE_DIGEST', 'default': '', 'description': 'Optional immutable backend digest produced by CI.'},
            {'type': 'string', 'name': 'WORKER_IMAGE_DIGEST', 'default': '', 'description': 'Optional immutable worker digest produced by CI.'}
          ] + common_runtime_parameters + [
            {'type': 'boolean', 'name': 'CONFIRM_DEPLOY', 'default': false, 'description': 'Required confirmation before changing EKS resources.'}
          ] }}
      - name: devops-project1-eks-pipeline
        description: EKS-native CI pipeline for frontend, backend, and worker.
        scm_url: "{{ project_scm_url }}"
        scm_ref: "*/{{ project_scm_branch }}"
        scm_credentials_id: ""
        script_path: Jenkins/Jenkinsfile.eks
        github_trigger: true
        parameters: >-
          {{ [
            {'type': 'string', 'name': 'REPO_URL', 'default': project_scm_url, 'description': 'Git repository URL.'},
            {'type': 'string', 'name': 'REPO_BRANCH', 'default': project_scm_branch, 'description': 'Git branch, tag, or ref to build.'},
            {'type': 'string', 'name': 'GIT_CREDENTIALS_ID', 'default': '', 'description': 'Optional Jenkins Git credential ID.'},
            {'type': 'string', 'name': 'APP_DIR', 'default': 'app', 'description': 'Application path in the repository.'},
            {'type': 'choice', 'name': 'DELIVERY_MODE', 'choices': ['DEPLOY_DEFAULT', 'BUILD_AND_DEPLOY'], 'description': 'Deploy the fixed owner public images or build operator-owned images.'},
            {'type': 'string', 'name': 'IMAGE_TAG', 'default': '', 'description': 'Optional immutable image tag override.'},
            {'type': 'string', 'name': 'DOCKERHUB_CREDENTIALS_ID', 'default': 'dockerhub-creds', 'description': 'Jenkins Docker Hub credential ID.'},
            {'type': 'string', 'name': 'DOCKERHUB_NAMESPACE', 'default': effective_dockerhub_namespace, 'description': 'Docker Hub user or organization namespace that owns the three image repositories.'},
            {'type': 'boolean', 'name': 'VALIDATE_ONLY', 'default': false, 'description': 'Run checks without build, push, content upload, or deployment.'},
            {'type': 'boolean', 'name': 'DEPLOY_TO_EKS', 'default': false, 'description': 'Trigger the standalone CD job after image publication.'},
            {'type': 'string', 'name': 'CD_JOB_NAME', 'default': 'devops-project1-eks-deploy', 'description': 'Standalone Jenkins CD job name.'},
            {'type': 'boolean', 'name': 'OVERWRITE_FRONTEND_CONTENT', 'default': false, 'description': 'Explicitly replace an existing S3 index.html.'}
          ] + common_runtime_parameters }}

  tasks:
    - name: Load encrypted registry identity for source-build delivery
      ansible.builtin.include_vars:
        file: "{{ local_environment_file }}"
        name: seed_local_environment
      no_log: true
      when: delivery_mode | default('DEPLOY_DEFAULT') == 'BUILD_AND_DEPLOY'

    - name: Select effective Docker Hub namespace
      ansible.builtin.set_fact:
        effective_dockerhub_namespace: >-
          {{
            seed_local_environment.dockerhub_username | default('') | lower
            if delivery_mode | default('DEPLOY_DEFAULT') == 'BUILD_AND_DEPLOY'
            else 'zer0w1'
          }}
      no_log: true

    - name: Validate Jenkins SCM and registry selections
      ansible.builtin.assert:
        that:
          - project_scm_url is match('^https://github\\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+\\.git$')
          - project_scm_branch | length > 0
          - >-
            delivery_mode | default('DEPLOY_DEFAULT') != 'BUILD_AND_DEPLOY' or
            effective_dockerhub_namespace is match('^[a-z0-9]+([._-][a-z0-9]+)*$')
        fail_msg: >-
          Jenkins seeding requires valid controller-local SCM values and, for
          source-build delivery, a valid Docker Hub username from the local vault.

    - name: Validate Jenkins job XML templates locally
      ansible.builtin.assert:
        that:
          - >-
            '<flow-definition plugin="workflow-job">' in lookup(
              'ansible.builtin.template',
              playbook_dir + '/../../templates/jenkins-pipeline-job.xml.j2',
              template_vars={'jenkins_job': item}
            )
          - item.scm_url is match('^https://github.com/.+\\.git$')
          - item.scm_ref | length > 0
          - item.script_path in ['Jenkins/Jenkinsfile.eks', 'Jenkins/Jenkinsfile-deploy']
          - item.parameters | map(attribute='name') | list | unique | length == item.parameters | length
        fail_msg: "Jenkins job definition is invalid: {{ item.name }}"
      loop: "{{ jenkins_jobs }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Report skipped Jenkins job seeding
      ansible.builtin.debug:
        msg: >-
          Jenkins job seeding is disabled. Set SEED_JENKINS_JOBS=true only after
          reviewing the private controller, target kubeconfig, and non-secret
          application runtime handoff.
      when: not seed_jenkins_jobs

    - name: Seed Jenkins jobs when explicitly enabled
      when: seed_jenkins_jobs
      block:
        - name: Validate Jenkins job mutation boundary
          ansible.builtin.assert:
            that:
              - jenkins_job_mutation_confirmation == 'JENKINS_JOB_MUTATION_APPROVED'
              - runtime_values_file is file
              - kubeconfig_file is file
            fail_msg: >-
              Job seeding requires the exact confirmation, the prepared target
              kubeconfig, and the non-secret application runtime handoff.
          no_log: true

        - name: Load prepared non-secret application runtime values
          ansible.builtin.include_vars:
            file: "{{ runtime_values_file }}"
            name: application_runtime
          no_log: true

        - name: Validate required runtime handoff values
          ansible.builtin.assert:
            that:
              - application_runtime.aws_region | length > 0
              - application_runtime.eks_cluster_name | length > 0
              - application_runtime.rds_hostname | length > 0
              - application_runtime.application_s3_bucket | length > 0
              - application_runtime.sns_topic_arn | length > 0
              - application_runtime.worker_db_secret_name == worker_db_secret_name
            fail_msg: Prepared application runtime handoff is incomplete or invalid.
          no_log: true

        - name: Render non-secret Jenkins job definitions into ConfigMaps
          kubernetes.core.k8s:
            state: present
            kubeconfig: "{{ kubeconfig_file }}"
            definition:
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: "jenkins-job-{{ item.name }}"
                namespace: "{{ jenkins_namespace }}"
                labels:
                  app.kubernetes.io/name: jenkins-job-seeder
                  app.kubernetes.io/managed-by: ansible
              data:
                config.xml: >-
                  {{ lookup(
                    'ansible.builtin.template',
                    playbook_dir + '/../../templates/jenkins-pipeline-job.xml.j2',
                    template_vars={'jenkins_job': item}
                  ) }}
          loop: "{{ jenkins_jobs }}"
          loop_control:
            label: "{{ item.name }}"

        - name: Launch short-lived in-cluster Jenkins job seeder
          kubernetes.core.k8s:
            state: present
            kubeconfig: "{{ kubeconfig_file }}"
            definition:
              apiVersion: batch/v1
              kind: Job
              metadata:
                generateName: jenkins-job-seeder-
                namespace: "{{ jenkins_namespace }}"
                labels:
                  app.kubernetes.io/name: jenkins-job-seeder
                  app.kubernetes.io/managed-by: ansible
              spec:
                activeDeadlineSeconds: 300
                backoffLimit: 2
                ttlSecondsAfterFinished: 300
                template:
                  metadata:
                    labels:
                      app.kubernetes.io/name: jenkins-job-seeder
                  spec:
                    automountServiceAccountToken: false
                    restartPolicy: Never
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: 65532
                      runAsGroup: 65532
                      fsGroup: 65532
                      seccompProfile:
                        type: RuntimeDefault
                    containers:
                      - name: seeder
                        image: python:3.12.11-alpine3.22@sha256:5e511b0e940def74dd23389510300c76017ca9bbc92484c40cff0951adf32245
                        imagePullPolicy: IfNotPresent
                        env:
                          - name: JENKINS_URL
                            value: "{{ jenkins_service_url }}"
                          - name: JENKINS_USER
                            valueFrom:
                              secretKeyRef:
                                name: "{{ jenkins_admin_secret_name }}"
                                key: jenkins-admin-user
                          - name: JENKINS_PASSWORD
                            valueFrom:
                              secretKeyRef:
                                name: "{{ jenkins_admin_secret_name }}"
                                key: jenkins-admin-password
                        command: [python, -c]
                        args:
                          - "{{ lookup('ansible.builtin.file', project_root + '/scripts/seed_jenkins_jobs.py') }}"
                        resources:
                          requests:
                            cpu: 50m
                            memory: 64Mi
                          limits:
                            cpu: 200m
                            memory: 128Mi
                        securityContext:
                          allowPrivilegeEscalation: false
                          capabilities:
                            drop: [ALL]
                          readOnlyRootFilesystem: true
                        volumeMounts:
                          - {name: cd-job, mountPath: /jobs/cd, readOnly: true}
                          - {name: ci-job, mountPath: /jobs/ci, readOnly: true}
                    volumes:
                      - name: cd-job
                        configMap:
                          name: jenkins-job-devops-project1-eks-deploy
                      - name: ci-job
                        configMap:
                          name: jenkins-job-devops-project1-eks-pipeline
          register: jenkins_seeder_job

        - name: Wait for the in-cluster Jenkins seeder to finish
          kubernetes.core.k8s_info:
            api_version: batch/v1
            kind: Job
            name: "{{ jenkins_seeder_job.result.metadata.name }}"
            namespace: "{{ jenkins_namespace }}"
            kubeconfig: "{{ kubeconfig_file }}"
          register: jenkins_seeder_status
          until: >-
            jenkins_seeder_status.resources | length == 1 and
            (jenkins_seeder_status.resources[0].status.conditions | default([]) |
             selectattr('type', 'in', ['Complete', 'Failed']) |
             selectattr('status', 'equalto', 'True') | list | length) > 0
          retries: 30
          delay: 10

        - name: Require successful in-cluster Jenkins job seeding
          ansible.builtin.assert:
            that:
              - (jenkins_seeder_status.resources[0].status.succeeded | default(0) | int) == 1
            fail_msg: >-
              The in-cluster Jenkins seeder failed. Inspect the short-lived
              jenkins-job-seeder pod logs before its five-minute TTL expires;
              credentials remain suppressed by the pod and Ansible tasks.
