---
- name: Trigger Jenkins CI for the initial application delivery
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - ../../vars/project.yml
    - ../../vars/project.local.yml

  vars:
    delivery_mode: >-
      {{ lookup('ansible.builtin.env', 'DELIVERY_MODE')
         | default('DEPLOY_DEFAULT', true)
         | upper }}
    deploy_image_tag: >-
      {{ lookup('ansible.builtin.env', 'DEPLOY_IMAGE_TAG')
         | default('', true) }}
    trigger_jenkins_delivery: >-
      {{ lookup('ansible.builtin.env', 'TRIGGER_JENKINS_DELIVERY')
         | default('false', true)
         | bool }}
    jenkins_delivery_confirmation: >-
      {{ lookup('ansible.builtin.env', 'JENKINS_DELIVERY_CONFIRMATION')
         | default('', true) }}

  tasks:
    - name: Load encrypted registry identity for source-build delivery
      ansible.builtin.include_vars:
        file: "{{ local_environment_file }}"
        name: trigger_local_environment
      no_log: true
      when: delivery_mode == 'BUILD_AND_DEPLOY'

    - name: Select effective source-build registry namespace
      ansible.builtin.set_fact:
        dockerhub_namespace: >-
          {{
            trigger_local_environment.dockerhub_username | default('') | lower
            if delivery_mode == 'BUILD_AND_DEPLOY'
            else ''
          }}
      no_log: true

    - name: Report skipped Jenkins CI trigger
      ansible.builtin.debug:
        msg: >-
          Jenkins delivery is disabled. Set TRIGGER_JENKINS_DELIVERY=true only
          after jobs and prerequisites are ready; DELIVERY_MODE defaults to the
          credential-free DEPLOY_DEFAULT path.
      when: not trigger_jenkins_delivery

    - name: Trigger Jenkins CI when explicitly enabled
      when: trigger_jenkins_delivery
      block:
        - name: Validate Jenkins CI trigger boundary
          ansible.builtin.assert:
            that:
              - jenkins_delivery_confirmation == 'JENKINS_DELIVERY_MUTATION_APPROVED'
              - kubeconfig_file is file
              - delivery_mode in ['BUILD_AND_DEPLOY', 'DEPLOY_DEFAULT']
              - delivery_mode == 'DEPLOY_DEFAULT' or dockerhub_namespace is match('^[a-z0-9]+([._-][a-z0-9]+)*$')
              - deploy_image_tag == '' or deploy_image_tag != 'latest'
              - deploy_image_tag == '' or deploy_image_tag is match('^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$')
            fail_msg: >-
              Jenkins CI triggering requires the exact confirmation and prepared
              target kubeconfig.

        - name: Verify the worker database Secret is ready for FULL CD
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Secret
            name: "{{ worker_db_secret_name }}"
            namespace: "{{ application_namespace }}"
            kubeconfig: "{{ kubeconfig_file }}"
          register: worker_db_secret_status

        - name: Require the worker database Secret before CI handoff
          ansible.builtin.assert:
            that:
              - worker_db_secret_status.resources | length == 1
            fail_msg: >-
              {{ worker_db_secret_name }} must exist in {{ application_namespace }}
              before CI can hand off to standalone FULL CD.

        - name: Launch short-lived in-cluster Jenkins CI trigger
          kubernetes.core.k8s:
            state: present
            kubeconfig: "{{ kubeconfig_file }}"
            definition:
              apiVersion: batch/v1
              kind: Job
              metadata:
                generateName: jenkins-ci-trigger-
                namespace: "{{ jenkins_namespace }}"
                labels:
                  app.kubernetes.io/name: jenkins-ci-trigger
                  app.kubernetes.io/managed-by: ansible
              spec:
                activeDeadlineSeconds: 600
                backoffLimit: 0
                ttlSecondsAfterFinished: 300
                template:
                  metadata:
                    labels:
                      app.kubernetes.io/name: jenkins-ci-trigger
                  spec:
                    automountServiceAccountToken: false
                    restartPolicy: Never
                    securityContext:
                      runAsNonRoot: true
                      runAsUser: 65532
                      runAsGroup: 65532
                      fsGroup: 65532
                      seccompProfile:
                        type: RuntimeDefault
                    containers:
                      - name: trigger
                        image: python:3.12.11-alpine3.22@sha256:5e511b0e940def74dd23389510300c76017ca9bbc92484c40cff0951adf32245
                        imagePullPolicy: IfNotPresent
                        env:
                          - {name: JENKINS_URL, value: "{{ jenkins_service_url }}"}
                          - {name: JENKINS_JOB, value: "{{ jenkins_ci_job_name }}"}
                          - {name: DELIVERY_MODE, value: "{{ delivery_mode }}"}
                          - {name: DOCKERHUB_NAMESPACE, value: "{{ dockerhub_namespace }}"}
                          - {name: DEPLOY_IMAGE_TAG, value: "{{ deploy_image_tag }}"}
                          - name: JENKINS_USER
                            valueFrom:
                              secretKeyRef:
                                name: "{{ jenkins_admin_secret_name }}"
                                key: jenkins-admin-user
                          - name: JENKINS_PASSWORD
                            valueFrom:
                              secretKeyRef:
                                name: "{{ jenkins_admin_secret_name }}"
                                key: jenkins-admin-password
                        command: [python, -c]
                        args:
                          - |
                            import base64, http.cookiejar, json, os, time, urllib.parse, urllib.request

                            root = os.environ["JENKINS_URL"].rstrip("/")
                            job = urllib.parse.quote(os.environ["JENKINS_JOB"], safe="")
                            auth = base64.b64encode(
                                f'{os.environ["JENKINS_USER"]}:{os.environ["JENKINS_PASSWORD"]}'.encode()
                            ).decode()
                            opener = urllib.request.build_opener(
                                urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar())
                            )

                            def request(path, method="GET", body=None, headers=None):
                                request_headers = {"Authorization": f"Basic {auth}"}
                                request_headers.update(headers or {})
                                req = urllib.request.Request(
                                    root + path,
                                    data=body,
                                    headers=request_headers,
                                    method=method,
                                )
                                with opener.open(req, timeout=30) as response:
                                    return response.status, response.read(), response.headers

                            crumb = json.loads(request("/crumbIssuer/api/json")[1])
                            parameters = {
                                "DELIVERY_MODE": os.environ["DELIVERY_MODE"],
                                "IMAGE_TAG": os.environ["DEPLOY_IMAGE_TAG"],
                                "DEPLOY_TO_EKS": "true",
                            }
                            if os.environ["DELIVERY_MODE"] == "BUILD_AND_DEPLOY":
                                parameters["DOCKERHUB_NAMESPACE"] = os.environ["DOCKERHUB_NAMESPACE"]
                            status, _, response_headers = request(
                                f"/job/{job}/buildWithParameters",
                                "POST",
                                urllib.parse.urlencode(parameters).encode(),
                                {
                                    "Content-Type": "application/x-www-form-urlencoded",
                                    crumb["crumbRequestField"]: crumb["crumb"],
                                },
                            )
                            if status != 201:
                                raise RuntimeError(f"Unexpected Jenkins queue status {status}")
                            queue_url = response_headers.get("Location", "").rstrip("/")
                            if not queue_url.startswith(root + "/queue/item/"):
                                raise RuntimeError("Jenkins queue response omitted the expected Location")
                            queue_path = queue_url[len(root):] + "/api/json"
                            build_url = ""
                            for _ in range(120):
                                queue = json.loads(request(queue_path)[1])
                                if queue.get("cancelled"):
                                    raise RuntimeError("Jenkins cancelled the queued CI build")
                                if queue.get("executable", {}).get("url"):
                                    build_url = queue["executable"]["url"].rstrip("/")
                                    break
                                time.sleep(5)
                            if not build_url.startswith(root + "/job/"):
                                raise RuntimeError("Jenkins did not assign the queued CI build")
                            build_path = build_url[len(root):] + "/api/json"
                            for _ in range(360):
                                build = json.loads(request(build_path)[1])
                                if not build.get("building", False) and build.get("result"):
                                    if build["result"] != "SUCCESS":
                                        raise RuntimeError(
                                            f'Jenkins CI build {build.get("number")} finished {build["result"]}'
                                        )
                                    print(
                                        f'Jenkins CI build {build.get("number")} completed SUCCESS '
                                        f'in {os.environ["DELIVERY_MODE"]} mode.'
                                    )
                                    break
                                time.sleep(10)
                            else:
                                raise RuntimeError("Timed out waiting for Jenkins CI completion")
                        resources:
                          requests: {cpu: 50m, memory: 64Mi}
                          limits: {cpu: 200m, memory: 128Mi}
                        securityContext:
                          allowPrivilegeEscalation: false
                          capabilities: {drop: [ALL]}
                          readOnlyRootFilesystem: true
          register: jenkins_ci_trigger_job

        - name: Wait for the in-cluster Jenkins CI trigger to finish
          kubernetes.core.k8s_info:
            api_version: batch/v1
            kind: Job
            name: "{{ jenkins_ci_trigger_job.result.metadata.name }}"
            namespace: "{{ jenkins_namespace }}"
            kubeconfig: "{{ kubeconfig_file }}"
          register: jenkins_ci_trigger_status
          until: >-
            jenkins_ci_trigger_status.resources | length == 1 and
            (jenkins_ci_trigger_status.resources[0].status.conditions | default([]) |
             selectattr('type', 'in', ['Complete', 'Failed']) |
             selectattr('status', 'equalto', 'True') | list | length) > 0
          retries: 60
          delay: 10

        - name: Require successful Jenkins CI completion
          ansible.builtin.assert:
            that:
              - (jenkins_ci_trigger_status.resources[0].status.succeeded | default(0) | int) == 1
            fail_msg: >-
              The exact Jenkins CI build did not complete successfully.

        - name: Read the Terraform-owned public application URL
          ansible.builtin.command:
            argv:
              - "{{ project_terraform_binary }}"
              - "-chdir={{ terraform_dir }}"
              - output
              - -raw
              - public_url
          register: public_application_url_command
          changed_when: false

        - name: Validate the Terraform-owned public application URL
          ansible.builtin.assert:
            that:
              - public_application_url_command.stdout | trim is match('^https://[^/]+$')
            fail_msg: >-
              Terraform output public_url must contain the canonical HTTPS shared
              ALB URL before Jenkins delivery can be verified.

        - name: Set the canonical public frontend URL
          ansible.builtin.set_fact:
            frontend_url: "{{ public_application_url_command.stdout | trim }}"

        - name: Read the selected public TLS mode
          ansible.builtin.command:
            argv:
              - "{{ project_terraform_binary }}"
              - "-chdir={{ terraform_dir }}"
              - output
              - -raw
              - public_tls_mode
          register: public_tls_mode_command
          changed_when: false

        - name: Validate the selected public TLS mode
          ansible.builtin.assert:
            that:
              - public_tls_mode_command.stdout | trim in ['route53', 'self_signed']
            fail_msg: Terraform output public_tls_mode is missing or invalid.

        - name: Wait for the shared ALB frontend health endpoint
          ansible.builtin.uri:
            url: "{{ frontend_url }}/health"
            method: GET
            return_content: true
            status_code: 200
            validate_certs: "{{ public_tls_mode_command.stdout | trim == 'route53' }}"
          register: frontend_health_response
          until: >-
            frontend_health_response.status | default(0) == 200 and
            frontend_health_response.json.status | default('') == 'ok' and
            frontend_health_response.json.service | default('') == 'backend-api'
          retries: 90
          delay: 10

        - name: Create the local generated-output directory
          ansible.builtin.file:
            path: "{{ generated_output_root }}"
            state: directory
            mode: "0755"

        - name: Write the public frontend URL locally
          ansible.builtin.copy:
            dest: "{{ frontend_url_file }}"
            mode: "0644"
            content: "{{ frontend_url }}\n"

        - name: Report the public frontend address
          ansible.builtin.debug:
            msg:
              - >-
                The exact Jenkins CI build completed successfully and the
                Terraform-owned shared ALB health endpoint is available.
              - "Open the application: {{ frontend_url }}"
              - "The URL is also saved at {{ frontend_url_file }}"
