---
# Top-level control-node orchestrator.
#
# Terraform Phase 1 exposes guarded input, infrastructure, EKS/Jenkins platform,
# runtime/Secret preparation, and Jenkins job-seeding stages. After this control
# plane flow succeeds, Jenkins CI owns image publication and initial S3 content;
# its explicit DEPLOY_TO_EKS handoff invokes standalone FULL CD. Do not append the
# legacy EC2 inventory/nginx/systemd flow.
- name: Prepare effective Terraform inputs
  ansible.builtin.import_playbook: prepare_terraform_inputs.yml

- name: Prepare public TLS and current GitHub network inputs
  ansible.builtin.import_playbook: prepare_public_tls.yml

- name: Configure Terraform state and infrastructure lifecycle
  ansible.builtin.import_playbook: configure_terraform_state.yml

- name: Configure EKS prerequisites and Jenkins platform lifecycle
  ansible.builtin.import_playbook: configure_eks_platform.yml

- name: Prepare non-secret application runtime handoff
  ansible.builtin.import_playbook: prepare_application_runtime.yml

- name: Seed separate Jenkins CI and CD jobs
  ansible.builtin.import_playbook: seed_jenkins_jobs.yml

- name: Configure Jenkins HMAC validation and GitHub repository webhook
  ansible.builtin.import_playbook: configure_github_webhook.yml

- name: Synchronize the worker database Kubernetes Secret
  ansible.builtin.import_playbook: prepare_application_secret.yml

- name: Configure optional operator-owned Jenkins registry credential
  ansible.builtin.import_playbook: configure_jenkins_registry_credential.yml

- name: Trigger Jenkins CI for initial delivery and FULL CD handoff
  ansible.builtin.import_playbook: trigger_jenkins_ci.yml
