---
- name: Destroy the Terraform-owned platform in dependency order
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - ../vars/project.yml

  vars:
    destroy_execute: >-
      {{ lookup('ansible.builtin.env', 'DESTROY_EXECUTE')
         | default('false', true)
         | bool }}
    retain_application_data: >-
      {{ lookup('ansible.builtin.env', 'RETAIN_APPLICATION_DATA')
         | default('false', true)
         | bool }}

  tasks:
    - name: Validate destroy flags locally
      ansible.builtin.assert:
        that:
          - not retain_application_data or destroy_execute
        fail_msg: >-
          Local recovery requires DESTROY_EXECUTE=true.

    - name: Report safe local-only mode
      ansible.builtin.debug:
        msg: >-
          Destroy is disabled. No AWS, Kubernetes, Helm, Terraform remote-state,
          network, or file-write operation was attempted.
      when: not destroy_execute

    - name: Verify Terraform ownership before destroy
      when: destroy_execute
      block:
        - name: Require project-local teardown tools and kubeconfig
          ansible.builtin.assert:
            that:
              - project_terraform_binary is file
              - project_helm_binary is file
              - project_kubectl_binary is file
              - kubeconfig_file is file
            fail_msg: "Run ../../setup.sh and create.yml before teardown."

        - name: List Terraform-owned resources
          ansible.builtin.command:
            argv: ["{{ project_terraform_binary }}", "-chdir={{ terraform_dir }}", state, list]
          register: terraform_resources
          changed_when: false

        - name: Read Terraform lifecycle outputs
          ansible.builtin.command:
            argv: ["{{ project_terraform_binary }}", "-chdir={{ terraform_dir }}", output, -json]
          register: terraform_output_command
          changed_when: false
          no_log: true

        - name: Parse Terraform lifecycle outputs
          ansible.builtin.set_fact:
            terraform_outputs: "{{ terraform_output_command.stdout | from_json }}"
          no_log: true

        - name: Verify required Terraform-owned resources
          ansible.builtin.assert:
            that:
              - terraform_resources.stdout_lines | length > 0
              - "'module.eks.aws_eks_cluster.project' in terraform_resources.stdout_lines"
              - "'module.rds_postgresql.aws_db_instance.postgres' in terraform_resources.stdout_lines"
              - "'module.s3_bucket.aws_s3_bucket.machine_catalog' in terraform_resources.stdout_lines"
            fail_msg: >-
              Terraform state does not own the required EKS, RDS, and application
              S3 resources. Nothing was changed.

        - name: Read current Kubernetes context and API endpoint
          ansible.builtin.command:
            argv: "{{ item }}"
          loop:
            - - "{{ project_kubectl_binary }}"
              - --kubeconfig
              - "{{ kubeconfig_file }}"
              - config
              - current-context
            - - "{{ project_kubectl_binary }}"
              - --kubeconfig
              - "{{ kubeconfig_file }}"
              - config
              - view
              - --minify
              - -o
              - "jsonpath={.clusters[0].cluster.server}"
          register: kubernetes_target
          changed_when: false
          no_log: true

        - name: Verify explicit kubeconfig targets the Terraform-owned API
          ansible.builtin.assert:
            that:
              - kubernetes_target.results[1].stdout == terraform_outputs.eks_cluster_endpoint.value
            fail_msg: >-
              The ignored project kubeconfig does not target the Terraform-owned
              EKS API endpoint. Nothing was changed.
          no_log: true

        - name: Display destructive scope and retained boundary
          ansible.builtin.debug:
            msg:
              - "EKS cluster: {{ terraform_outputs.eks_cluster_name.value }}"
              - "Application bucket: {{ terraform_outputs.s3_bucket_name.value }}"
              - "Terraform-owned resources: {{ terraform_resources.stdout_lines | length }}"
              - "The separate remote-state bucket is retained."

        - name: Require exact teardown confirmation
          ansible.builtin.pause:
            prompt: >-
              Type DESTROY {{ terraform_outputs.eks_cluster_name.value }}
              {{ terraform_outputs.s3_bucket_name.value }} to authorize teardown
          register: teardown_confirmation

        - name: Validate exact teardown confirmation
          ansible.builtin.assert:
            that:
              - >-
                teardown_confirmation.user_input == 'DESTROY ' ~
                terraform_outputs.eks_cluster_name.value ~ ' ' ~
                terraform_outputs.s3_bucket_name.value
            fail_msg: "Teardown cancelled; nothing was changed."

    - name: Back up optional application data and destroy the platform
      when: destroy_execute
      block:
        - name: Create timestamp for local recovery
          ansible.builtin.command:
            argv: [date, -u, +%Y%m%dT%H%M%SZ]
          register: recovery_timestamp
          changed_when: false
          when: retain_application_data

        - name: Create private local recovery directory
          ansible.builtin.file:
            path: "{{ recovery_root }}/{{ recovery_timestamp.stdout }}"
            state: directory
            mode: "0700"
          when: retain_application_data

        - name: Download exact application objects locally
          ansible.builtin.command:
            argv:
              - aws
              - s3api
              - get-object
              - --bucket
              - "{{ terraform_outputs.s3_bucket_name.value }}"
              - --key
              - "{{ item }}"
              - "{{ recovery_root }}/{{ recovery_timestamp.stdout }}/{{ item }}"
          loop: "{{ application_object_keys }}"
          no_log: true
          when: retain_application_data

        - name: Validate recovered catalog JSON
          ansible.builtin.command:
            argv:
              - python3
              - -m
              - json.tool
              - "{{ recovery_root }}/{{ recovery_timestamp.stdout }}/instances.json"
          changed_when: false
          no_log: true
          when: retain_application_data

        - name: Remove Kubernetes workloads and Jenkins state
          ansible.builtin.command:
            argv: >-
              {{
                [
                  'bash',
                  project_root ~ '/scripts/destroy_kubernetes_workloads.sh',
                  application_namespace,
                  jenkins_namespace,
                  jenkins_release_name
                ] + application_releases
              }}
          environment:
            HELM_BIN: "{{ project_helm_binary }}"
            KUBECTL_BIN: "{{ project_kubectl_binary }}"
            KUBECONFIG_PATH: "{{ kubeconfig_file }}"

        - name: Delete the two application bucket objects
          ansible.builtin.command:
            argv:
              - aws
              - s3api
              - delete-object
              - --bucket
              - "{{ terraform_outputs.s3_bucket_name.value }}"
              - --key
              - "{{ item }}"
          loop: "{{ application_object_keys }}"
          no_log: true

        - name: Destroy the verified Terraform-owned main stack
          ansible.builtin.command:
            argv:
              - "{{ project_terraform_binary }}"
              - "-chdir={{ terraform_dir }}"
              - destroy
              - -auto-approve
              - -input=false
              - -no-color

        - name: Verify main Terraform state is empty
          ansible.builtin.command:
            argv: ["{{ project_terraform_binary }}", "-chdir={{ terraform_dir }}", state, list]
          register: post_destroy_state
          changed_when: false
          failed_when: post_destroy_state.stdout_lines | length > 0

        - name: Report retained state bucket boundary
          ansible.builtin.debug:
            msg: >-
              Main-stack state is empty. The separate Terraform remote-state
              bucket remains intentionally retained.
