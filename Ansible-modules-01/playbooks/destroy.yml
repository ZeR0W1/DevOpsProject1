---
- name: Review and authorize the platform destruction lifecycle
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - ../vars/project.yml
    - ../vars/project.local.yml

  vars:
    destroy_execute: >-
      {{ lookup('ansible.builtin.env', 'DESTROY_EXECUTE')
         | default('false', true) | bool }}
    retain_application_data: >-
      {{ lookup('ansible.builtin.env', 'RETAIN_APPLICATION_DATA')
         | default('false', true) | bool }}
    destroy_resume: >-
      {{ lookup('ansible.builtin.env', 'DESTROY_RESUME')
         | default('false', true) | bool }}

  tasks:
    - name: Validate destroy flags locally
      ansible.builtin.assert:
        that:
          - not retain_application_data or destroy_execute
          - not destroy_resume or destroy_execute
          - not destroy_resume or not retain_application_data
        fail_msg: >-
          Retention and resume require DESTROY_EXECUTE=true. Resume cannot repeat
          the initial application-data backup or other completed teardown stages.

    - name: Report safe local-only mode
      ansible.builtin.debug:
        msg: >-
          Destroy is disabled. No AWS, Kubernetes, Helm, Terraform remote-state,
          network, or file-write operation was attempted.
      when: not destroy_execute

    - name: Inspect Terraform ownership and select teardown mode
      when: destroy_execute
      block:
        - name: Require the project-local Terraform binary
          ansible.builtin.assert:
            that:
              - project_terraform_binary is file
            fail_msg: "Run bash ../setup.sh before teardown."

        - name: List Terraform-owned resources
          ansible.builtin.command:
            argv: ["{{ project_terraform_binary }}", "-chdir={{ terraform_dir }}", state, list]
          register: destroy_terraform_resources
          changed_when: false

        - name: Select normal, resume, or already-complete mode
          ansible.builtin.set_fact:
            destroy_mode: >-
              {{
                'complete'
                if destroy_terraform_resources.stdout_lines | length == 0
                else ('resume' if destroy_resume else 'normal')
              }}

        - name: Report already-complete teardown
          ansible.builtin.debug:
            msg: >-
              Main Terraform state is already empty. The separate remote-state
              bucket remains intentionally retained; no mutation was attempted.
          when: destroy_mode == 'complete'

        - name: Prepare normal teardown ownership context
          when: destroy_mode == 'normal'
          block:
            - name: Require normal teardown tools and kubeconfig
              ansible.builtin.assert:
                that:
                  - project_helm_binary is file
                  - project_kubectl_binary is file
                  - kubeconfig_file is file
                  - local_environment_file is file
                  - project_local_vars_file is file
                  - project_github_repository is match('^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$')
                fail_msg: "Run bash ../setup.sh and create.yml before normal teardown."

            - name: Read Terraform lifecycle outputs
              ansible.builtin.command:
                argv: ["{{ project_terraform_binary }}", "-chdir={{ terraform_dir }}", output, -json]
              register: destroy_terraform_output_command
              changed_when: false
              no_log: true

            - name: Parse Terraform lifecycle outputs
              ansible.builtin.set_fact:
                destroy_terraform_outputs: >-
                  {{ destroy_terraform_output_command.stdout | from_json }}
              no_log: true

            - name: Verify required Terraform-owned resources
              ansible.builtin.assert:
                that:
                  - "'module.eks.aws_eks_cluster.project' in destroy_terraform_resources.stdout_lines"
                  - "'module.rds_postgresql.aws_db_instance.postgres' in destroy_terraform_resources.stdout_lines"
                  - "'module.s3_bucket.aws_s3_bucket.machine_catalog' in destroy_terraform_resources.stdout_lines"
                fail_msg: >-
                  Terraform state does not own the required EKS, RDS, and
                  application S3 resources. Nothing was changed.

            - name: Read current Kubernetes API endpoint
              ansible.builtin.command:
                argv:
                  - "{{ project_kubectl_binary }}"
                  - --kubeconfig
                  - "{{ kubeconfig_file }}"
                  - config
                  - view
                  - --minify
                  - -o
                  - "jsonpath={.clusters[0].cluster.server}"
              register: destroy_kubernetes_endpoint
              changed_when: false
              no_log: true

            - name: Verify kubeconfig targets the Terraform-owned API
              ansible.builtin.assert:
                that:
                  - >-
                    destroy_kubernetes_endpoint.stdout ==
                    destroy_terraform_outputs.eks_cluster_endpoint.value
                fail_msg: >-
                  The ignored project kubeconfig does not target the
                  Terraform-owned EKS API endpoint. Nothing was changed.
              no_log: true

            - name: Check for recorded Ansible-owned certificate ARN
              ansible.builtin.stat:
                path: "{{ public_tls_certificate_arn_file }}"
              register: destroy_recorded_certificate_arn

            - name: Read recorded Ansible-owned certificate ARN
              ansible.builtin.slurp:
                src: "{{ public_tls_certificate_arn_file }}"
              register: destroy_recorded_certificate_arn_content
              no_log: true
              when: destroy_recorded_certificate_arn.stat.exists

            - name: Select and validate certificate cleanup boundary
              ansible.builtin.set_fact:
                destroy_self_signed_certificate_arn: >-
                  {{
                    destroy_recorded_certificate_arn_content.content | b64decode | trim
                    if destroy_recorded_certificate_arn.stat.exists else ''
                  }}
              no_log: true

            - name: Validate recorded certificate ownership
              ansible.builtin.assert:
                that:
                  - >-
                    destroy_self_signed_certificate_arn | length == 0 or
                    destroy_self_signed_certificate_arn ==
                    destroy_terraform_outputs.self_signed_certificate_arn.value
                fail_msg: >-
                  The recorded Ansible-owned certificate ARN does not match the
                  ARN consumed by Terraform; refusing certificate deletion.
              no_log: true

            - name: Display normal destructive scope and retained boundary
              ansible.builtin.debug:
                msg:
                  - "EKS cluster: {{ destroy_terraform_outputs.eks_cluster_name.value }}"
                  - >-
                    All user-installed content in this verified dedicated cluster
                    is included, including ad-hoc lab installations.
                  - "Application bucket: {{ destroy_terraform_outputs.s3_bucket_name.value }}"
                  - "GitHub repository webhook: {{ project_github_repository }}"
                  - >-
                    Terraform-owned resources:
                    {{ destroy_terraform_resources.stdout_lines | length }}
                  - >-
                    Application-data backup requested:
                    {{ retain_application_data | bool }}
                  - "The separate remote-state bucket is retained."

        - name: Display resumed destructive scope and retained boundary
          ansible.builtin.debug:
            msg:
              - >-
                Resume mode will destroy the remaining
                {{ destroy_terraform_resources.stdout_lines | length }}
                Terraform state-owned resources only.
              - >-
                Kubernetes, GitHub webhook, application-data, and certificate
                cleanup stages will not be repeated.
              - "The separate remote-state bucket is retained."
          when: destroy_mode == 'resume'

        - name: Require exact teardown confirmation
          ansible.builtin.pause:
            prompt: >-
              Type DESTROY to authorize the displayed {{ destroy_mode }} teardown
              scope, or CANCEL to stop
          register: destroy_confirmation
          until: >-
            destroy_confirmation.user_input | trim | upper in ['DESTROY', 'CANCEL']
          retries: 5
          delay: 0
          when: destroy_mode in ['normal', 'resume']

        - name: Validate exact teardown confirmation
          ansible.builtin.assert:
            that:
              - destroy_confirmation.user_input | trim | upper == 'DESTROY'
            fail_msg: "Teardown cancelled; nothing was changed."
          when: destroy_mode in ['normal', 'resume']

- name: Run the authorized normal destroy lifecycle
  ansible.builtin.import_playbook: destroy/lifecycle.yml
  vars:
    destroy_normal_lifecycle_enabled: >-
      {{ hostvars['localhost']['destroy_mode'] | default('disabled') == 'normal' }}
    destroy_backup_authorization: DESTROY_BACKUP_AUTHORIZED
    destroy_webhook_authorization: DESTROY_WEBHOOK_AUTHORIZED
    destroy_eks_purge_authorization: DESTROY_EKS_PURGE_AUTHORIZED
    destroy_terraform_authorization: DESTROY_TERRAFORM_AUTHORIZED
    destroy_tls_cleanup_authorization: DESTROY_TLS_CLEANUP_AUTHORIZED
    retain_application_data: >-
      {{ hostvars['localhost']['retain_application_data'] | default(false) }}
    destroy_application_bucket: >-
      {{ hostvars['localhost']['destroy_terraform_outputs']['s3_bucket_name']['value'] | default('') }}
    destroy_jenkins_webhook_url: >-
      {{ hostvars['localhost']['destroy_terraform_outputs']['jenkins_webhook_url']['value'] | default('') }}
    project_scm_url: "{{ hostvars['localhost']['project_scm_url'] | default('') }}"
    project_scm_branch: "{{ hostvars['localhost']['project_scm_branch'] | default('') }}"
    project_github_repository: >-
      {{ hostvars['localhost']['project_github_repository'] | default('') }}
    destroy_self_signed_certificate_arn: >-
      {{ hostvars['localhost']['destroy_self_signed_certificate_arn'] | default('') }}
    destroy_aws_region: >-
      {{ hostvars['localhost']['destroy_terraform_outputs']['aws_region']['value'] | default('') }}

- name: Run the authorized Terraform destroy resume
  ansible.builtin.import_playbook: destroy/resume_terraform_destroy.yml
  when: destroy_resume_lifecycle_enabled | default(false) | bool
  vars:
    destroy_resume_lifecycle_enabled: >-
      {{ hostvars['localhost']['destroy_mode'] | default('disabled') == 'resume' }}
    destroy_resume_authorization: DESTROY_RESUME_AUTHORIZED
