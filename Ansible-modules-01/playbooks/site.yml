---
# Dev/testing orchestrator for control-node execution.
# This file runs the full provisioning flow end-to-end:
# 1) apply Terraform infrastructure
# 2) sync Terraform outputs
# 3) configure frontend nginx
# 4) deploy backend/worker app services
#
# It is not intended to run *on* EC2 instances themselves.
- name: Apply Terraform infrastructure
  ansible.builtin.import_playbook: apply_terraform.yml

- name: Sync dynamic infra values from Terraform outputs
  ansible.builtin.import_playbook: sync_from_terraform.yml

- name: Configure frontend nginx
  ansible.builtin.import_playbook: install-nginx.yml

- name: Deploy backend and worker application services
  ansible.builtin.import_playbook: deploy_app.yml
