- name: Install nginx, then configure nginx
  hosts: web
  become: true

  vars_files:
    - ../vault/staging.yml

  vars:
    # SSH key path is sourced from Ansible Vault for this environment.
    ansible_ssh_private_key_file: "{{ vault_ssh_private_key_path }}"
    # Optional local status endpoint (used for quick nginx health checks).
    nginx_config_status_enable: true
    nginx_config_status_port: 8080

  roles:
    # Installs nginx package/service.
    - role: nginx
      tags: ["nginx_install"]
    # Applies nginx configuration templates/vhosts.
    - role: nginx_config
      tags: ["nginx_config", "nginx"]
    # Syncs frontend index content from S3/bootstrap script.
    - role: frontend_content
      tags: ["frontend_content", "frontend"]
