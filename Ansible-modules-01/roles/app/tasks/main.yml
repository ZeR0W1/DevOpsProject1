---
- name: Ensure application group exists
  ansible.builtin.group:
    name: "{{ app_group }}"
    state: present
  tags: [app, deploy]

- name: Ensure application user exists
  ansible.builtin.user:
    name: "{{ app_user }}"
    group: "{{ app_group }}"
    shell: /bin/bash
    create_home: true
    state: present
  tags: [app, deploy]

- name: Ensure application directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0755"
  loop:
    - "{{ app_dir }}"
    - "{{ app_src_dir }}"
  tags: [app, deploy]

- name: Build runtime sync path list for backend host
  ansible.builtin.set_fact:
    # Backend receives shared files + backend-specific source paths.
    app_runtime_sync_paths: "{{ app_runtime_sync_paths_common + app_runtime_sync_paths_backend }}"
  when: "'backend' in group_names"
  tags: [app, deploy]

- name: Build runtime sync path list for worker host
  ansible.builtin.set_fact:
    # Worker receives shared files + worker-specific source paths.
    app_runtime_sync_paths: "{{ app_runtime_sync_paths_common + app_runtime_sync_paths_worker }}"
  when: "'worker' in group_names"
  tags: [app, deploy]

- name: Copy runtime application files
  ansible.builtin.copy:
    src: "app/{{ item }}"
    dest: "{{ app_src_dir }}/{{ item }}"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0644"
  loop: "{{ app_runtime_sync_paths }}"
  notify: restart app
  tags: [app, deploy]

- name: Install Python dependencies into virtualenv
  ansible.builtin.pip:
    requirements: "{{ item }}"
    virtualenv: "{{ app_venv_dir }}"
    virtualenv_command: python3 -m venv
  become: true
  become_user: "{{ app_user }}"
  loop: "{{ app_requirements_files }}"
  notify: restart app
  tags: [app, deploy]

- name: Build effective runtime environment from group/host vars
  ansible.builtin.set_fact:
    # Service template consumes this merged map for Environment= entries.
    app_environment_effective: "{{ app_environment | default({}) }}"
  tags: [app, service, deploy]

- name: Deploy systemd service unit
  ansible.builtin.template:
    src: app.service.j2
    dest: "/etc/systemd/system/{{ app_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify:
    - reload systemd
    - restart app
  tags: [app, service]

- name: Enable and start application service
  ansible.builtin.systemd:
    name: "{{ app_service_name }}"
    state: started
    enabled: true
    daemon_reload: true
  tags: [app, service]
