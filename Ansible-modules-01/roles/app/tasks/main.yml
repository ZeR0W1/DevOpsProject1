---
- name: Ensure application group exists
  ansible.builtin.group:
    name: "{{ app_group }}"
    state: present
  tags: [app, deploy]

- name: Ensure application user exists
  ansible.builtin.user:
    name: "{{ app_user }}"
    group: "{{ app_group }}"
    shell: /bin/bash
    create_home: true
    state: present
  tags: [app, deploy]

- name: Ensure application directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0755"
  loop:
    - "{{ app_dir }}"
    - "{{ app_src_dir }}"
  tags: [app, deploy]

- name: Copy application source files
  ansible.builtin.copy:
    src: app/
    dest: "{{ app_src_dir }}/"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0644"
  notify: restart app
  tags: [app, deploy]

- name: Install Python dependencies into virtualenv
  ansible.builtin.pip:
    requirements: "{{ item }}"
    virtualenv: "{{ app_venv_dir }}"
    virtualenv_command: python3 -m venv
  become_user: "{{ app_user }}"
  loop: "{{ app_requirements_files }}"
  notify: restart app
  tags: [app, deploy]

- name: Deploy systemd service unit
  ansible.builtin.template:
    src: app.service.j2
    dest: "/etc/systemd/system/{{ app_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify:
    - reload systemd
    - restart app
  tags: [app, service]

- name: Enable and start application service
  ansible.builtin.systemd:
    name: "{{ app_service_name }}"
    state: started
    enabled: true
    daemon_reload: true
  tags: [app, service]
