---
- name: Install base Python runtime prerequisites
  ansible.builtin.package:
    name:
      - python3
      - python3-pip
      - python3-setuptools
      - python3-wheel
    state: present

- name: Ensure Python packaging library is available for Ansible pip module
  ansible.builtin.command:
    cmd: python3 -m pip install --upgrade packaging
  register: common_packaging_install
  changed_when: "'Successfully installed' in common_packaging_install.stdout or 'Requirement already satisfied' not in common_packaging_install.stdout"
