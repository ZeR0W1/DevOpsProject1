nameOverride: ""
fullnameOverride: ""

namespace: devops-app

image:
  repository: zer0w1/devops-project1-frontend
  tag: "1.0.0"
  pullPolicy: IfNotPresent

replicaCount: 2

service:
  # The frontend LoadBalancer is the only public application endpoint.
  # Backend and worker Services remain internal ClusterIPs.
  type: LoadBalancer
  port: 80
  targetPort: 8080

backendService:
  host: backend
  port: 8000

ingress:
  # Disabled because the frontend LoadBalancer Service is the public entry point.
  enabled: false
  className: nginx
  annotations: {}
  host: devops-app.local
  path: /
  pathType: Prefix
  tls:
    enabled: false
    secretName: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

securityContext:
  runAsNonRoot: true
  runAsUser: 100
  runAsGroup: 102
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false

serviceAccount:
  create: true
  name: frontend-sa
  annotations: {}

frontendContent:
  enabled: true
  # CD owns this external runtime ConfigMap. Set create=true only for isolated
  # chart testing that intentionally uses the packaged repository default.
  create: false
  configMapName: frontend-runtime-content
  mountPath: /usr/share/nginx/html
  # Canonical repository source used by CI to seed S3 when index.html is absent.
  sourceFile: app/src/frontend/index.html