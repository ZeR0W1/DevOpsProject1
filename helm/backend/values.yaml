nameOverride: ""
fullnameOverride: ""

namespace: devops-app

image:
  repository: yourdockerhubuser/devops-app-backend # replace with your real Docker Hub backend repository
  tag: "1.0.0"
  pullPolicy: IfNotPresent

replicaCount: 2

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

workerService:
  host: worker
  port: 8000

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 15
  periodSeconds: 20

readinessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 10

securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false

serviceAccount:
  create: true
  name: backend-sa
  annotations: {}

env:
  API_HOST: 0.0.0.0
  API_PORT: "8000"
  WORKER_HOST: worker
  WORKER_PORT: "8000"