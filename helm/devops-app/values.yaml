nameOverride: ""
fullnameOverride: ""

namespace:
  create: true
  name: devops-app

global:
  awsRegion: us-east-1
  existingSecretName: devops-app-secrets

frontend:
  enabled: true
  replicaCount: 2
  image:
    repository: your-registry/devops-app-frontend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  livenessProbe:
    httpGet:
      path: /
      port: 8080
    initialDelaySeconds: 15
    periodSeconds: 20
  readinessProbe:
    httpGet:
      path: /
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
  securityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
  frontendContent:
    indexHtml: |
      <!DOCTYPE html>
      <html lang="en">
      <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>DevOps App</title>
      </head>
      <body>
        <h1>DevOps App Frontend Placeholder</h1>
        <p>This content will be replaced with your real frontend page.</p>
      </body>
      </html>

backend:
  enabled: true
  replicaCount: 2
  image:
    repository: your-registry/devops-app-backend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  livenessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 15
    periodSeconds: 20
  readinessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 5
    periodSeconds: 10
  securityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
  env:
    API_HOST: 0.0.0.0
    API_PORT: "8000"
    WORKER_HOST: devops-app-worker
    WORKER_PORT: "8000"

worker:
  enabled: true
  replicaCount: 2
  image:
    repository: your-registry/devops-app-worker
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
    targetPort: 8000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  livenessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 20
    periodSeconds: 20
  readinessProbe:
    httpGet:
      path: /health
      port: 8000
    initialDelaySeconds: 10
    periodSeconds: 10
  securityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
  env:
    API_PORT: "8000"
    BACKEND_HOST: devops-app-backend
    BACKEND_PORT: "8000"
    POSTGRES_ENABLED: "true"
    POSTGRES_HOST: your-rds-endpoint
    POSTGRES_PORT: "5432"
    POSTGRES_DB: postgres
    POSTGRES_USER: postgres_master
    POSTGRES_PASSWORD_SECRET_NAME: project/postgresql/master-password
    POSTGRES_TABLE: machines
    POSTGRES_SSLMODE: verify-full
    AWS_REGION: us-east-1
    S3_BUCKET_NAME: your-bucket-name
    S3_INSTANCES_OBJECT_KEY: instances.json
    SNS_NOTIFICATIONS_ENABLED: "true"
    SNS_TOPIC_ARN: your-sns-topic-arn

serviceAccount:
  create: true
  annotations: {}
  frontend:
    name: frontend-sa
  backend:
    name: backend-sa
  worker:
    name: worker-sa

ingress:
  enabled: true
  className: nginx
  annotations: {}
  host: devops-app.local
  path: /
  pathType: Prefix
  tls:
    enabled: false
    secretName: ""

networkPolicy:
  enabled: false

secrets:
  create: false
  name: devops-app-secrets
  data:
    postgresPassword: ""

rbac:
  create: false

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70